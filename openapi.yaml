openapi: 3.1.1
info:
  version: '2.16.0'
  title: ADR RewardSTACK™ Platform
  description: |
    ADR RewardSTACK™ management API.

    # Best Practices

    ## Authentication and token reuse

    All API requests (other than `POST /token`) are authenticated with a JSON
    Web Token passed via the `Authorization: Bearer` header. Tokens are valid
    for 2 hours by default and the lifetime is configurable with the
    `hoursUntilExpiry` parameter when generating the token.

    Generate a token once and use it until it expires:

    - Cache the token returned by `POST /token` along with the `expires` Unix
      timestamp included in the response.
    - Reuse the cached token for every request until shortly before it expires,
      then generate a new one. A well-behaved client should be generating a new
      token at most once every hour or two.
    - Do **not** generate a new token before every API call.

    ## Failed logins

    After 5 failed logins, `POST /token` answers `423 Locked` instead of
    checking the credentials. The lock ends 15 minutes after the last failed
    login. Check the API user and password before retrying.

    ## Response compatibility

    The RewardSTACK API follows [Semantic Versioning](https://semver.org/). We
    reserve the right to add new fields to response objects at any time as part
    of our backward-compatible versioning strategy; additive changes are not
    considered breaking.

    Client applications must implement forward-compatible JSON parsing that
    gracefully ignores unknown fields. Configure your JSON library to skip
    unrecognized fields rather than fail — most modern JSON libraries support
    this behavior by default or through configuration options.

    ## Rate limiting

    We do not currently enforce a general rate limit on API endpoints. Failed
    logins are limited as described in "Failed logins" above.

    ## Errors

    Each operation lists the error responses it returns. Error bodies are not
    the same everywhere: depending on the operation, the body is a list of
    messages, an object with `message`, an object with `message` and
    `errors`, or, for service awards, an object with `error`. A `401` with
    `{"message": "Forbidden"}` means the token's user cannot access the
    organization or program in the URL. An unexpected error answers `500`
    with `{"status": "error", "message": "Internal server error"}`.
  contact:
    email: technology@alldigitalrewards.com
servers:
  - url: https://admin.stage.alldigitalrewards.com
    description: Staging environment
  - url: https://admin.alldigitalrewards.com
    description: Production environment
tags:
  - name: Token
    description: >-
      Generate a JSON Web Token for use in API access. This token is valid
      for 2 hours after creation by default.
  - name: Organization
    description: Operations for organization management and review.
  - name: Organization > Webhook
    description: Operations for webhook management and review.
  - name: Program
    description: Operations for program management and review.
  - name: Participant
    description: Operations for participant management and review.
  - name: Participant > Point Adjustment
    description: Credit or Debit Points from Participants.
  - name: point sharing
    description: Share points between participants within the same program.
  - name: Participant > SSO
    description: Generate Single Sign On URL for Participants.
  - name: Participant > Transaction
    description: Operations for transaction management and review.
  - name: Transaction
    description: Transaction lookups that are not scoped to a program or participant in the URL.
  - name: Program > Catalog
    description: Search and browse the product catalog for a program.
  - name: Service Award
    description: >-
      Manage service awards for a program. Service awards allow you to
      automatically issue rewards (points or products) to participants based on
      milestone dates such as hire anniversaries. Awards can be configured to
      trigger yearly or at a custom interval. Most error bodies use an
      error field. The 401 and the 404 for a missing program use status
      and message instead: when the program in the URL does not exist,
      every service award operation answers 404 with
      {"status": "error", "message": "Program not found or invalid program ID"}.
  - name: Milestone
    description: Operations for milestone management and review.
  - name: Milestone > Activity
    description: Operations for milestone activity management.
  - name: Milestone > Participant Progress
    description: Operations for participant milestone progress tracking.
  - name: Batch
    description: Batch operations for creating multiple resources at once.
paths:
  /token:
    post:
      tags:
        - Token
      summary: Use Basic authentication to generate a new JWT for use in API access
      operationId: generateToken
      security:
        - BasicAuth: [ ]
      parameters:
        - name: hoursUntilExpiry
          in: query
          required: false
          description: Number of hours until the token expires.
          schema:
            type: integer
            minimum: 1
            maximum: 8760
            default: 2
        - name: tokenName
          in: query
          required: false
          description: Optional name for the token.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: false
        description: >-
          The same parameters can be sent in a JSON body instead of the query
          string.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JwtRequest'
      responses:
        '201':
          description: JWT is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example:
                  - "The hoursUntilExpiry parameter must be an integer."
                  - "The maximum token duration is 8760 hours (1 year)."
        '401':
          description: Unauthorized Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '423':
          description: >-
            Locked after 5 failed logins. The lock ends 15 minutes after the
            last failed login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorsResponse'
              example:
                message: Locked
                errors:
                  - The resource that is being accessed is locked
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          description: Unknown exception
  /api/auth/tokens:
    post:
      tags:
        - Token
      summary: Generate a new JWT with an existing token
      operationId: generateTokenWithToken
      security:
        - Bearer: [ ]
      description: >-
        Generates a new token for the same user as the token in the
        `Authorization` header, without sending the API user and password
        again. Takes the same parameters as `POST /token`, in the query string
        or a JSON body.
      parameters:
        - name: hoursUntilExpiry
          in: query
          required: false
          description: Number of hours until the token expires.
          schema:
            type: integer
            minimum: 1
            maximum: 8760
            default: 2
        - name: tokenName
          in: query
          required: false
          description: Optional name for the token.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JwtRequest'
      responses:
        '201':
          description: JWT is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Token
      summary: List generated tokens
      operationId: listTokens
      security:
        - Bearer: [ ]
      description: >-
        Lists the tokens generated for the token's user, 30 per page. The
        token values themselves are never returned.
      parameters:
        - name: page
          in: query
          required: false
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenReferenceList'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/tokens/invalidate:
    post:
      tags:
        - Token
      summary: Revoke a token
      operationId: invalidateToken
      security:
        - Bearer: [ ]
      description: >-
        Revokes a token before it expires. Use the `jti` from `GET
        /api/auth/tokens`. A revoked token can no longer be used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jti
              properties:
                jti:
                  type: string
                  description: The token id (`jti`) from `GET /api/auth/tokens`.
      responses:
        '200':
          description: Token revoked. The response has no body.
        '400':
          description: No `jti` was sent.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - You must provide a valid JTI to invalidate a JWT token.
        '404':
          description: No token with this `jti` was found for the token's user.
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organization:
    get:
      tags:
        - Organization
      summary: Retrieve organization collection with optional filters
      operationId: getOrganizationList
      security:
        - Bearer: [ ]
      description: >-
        Returns organization collection. List rows are shorter than a single
        organization: `industry_program` and `updated_at` are always null and
        `domains` is not returned. Use `GET /api/organization/{uniqueId}` for
        those fields.
      parameters:
        - name: parent
          in: query
          required: false
          description: Return all children organizations of this parent unique identifier.
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Fuzzy match on the name of organization to return.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Request a specific page number starting with page 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: >-
            Set the number of desired results per page. Values above 500 are
            treated as 500.
          schema:
            type: integer
            minimum: 1
            default: 30
        - name: orderBy[field]
          in: query
          required: false
          description: >-
            Sort the list by this organization field, for example `name` or
            `unique_id`. Send together with `orderBy[direction]`.
          schema:
            type: string
        - name: orderBy[direction]
          in: query
          required: false
          description: Sort direction. Send together with `orderBy[field]`.
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationList'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          description: Unknown exception
    post:
      tags:
        - Organization
      summary: Add a new organization.
      operationId: addOrganization
      security:
        - Bearer: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
        description: Organization object to add to the marketplace.
        required: true
      responses:
        '201':
          description: Create a new organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRead'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          description: Unknown exception
  /api/organization/{uniqueId}:
    get:
      tags:
        - Organization
      operationId: getOrganization
      security:
        - Bearer: [ ]
      summary: Find an organization by ID
      description: Returns a single organization.
      parameters:
        - name: uniqueId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRead'
        '401':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Organization not found
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Organization
      summary: Update an organization.
      operationId: updateOrganization
      security:
        - Bearer: [ ]
      description: >-
        Not a partial update: the body is checked like a create, so `name`,
        `unique_id` and `parent` must be sent every time, even though
        `unique_id` and `parent` cannot change. A body with only the fields to
        change fails with 400.
      parameters:
        - name: uniqueId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
        description: >-
          The full organization: `name`, `unique_id` and `parent` are required
          on every update.
        required: true
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRead'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
              example:
                message: Validation Failed
                errors:
                  unique_id:
                    Required::NON_EXISTENT_KEY: unique_id must be provided, but does not exist
        '401':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          description: Unknown exception
  /api/organization/{uniqueId}/domain:
    get:
      tags:
        - Organization
      summary: List an organization's domains
      operationId: getOrganizationDomains
      security:
        - Bearer: [ ]
      description: Returns the domains of an organization.
      parameters:
        - name: uniqueId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationDomain'
        '401':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organization/{uniqueId}/balance:
    get:
      tags:
        - Organization
      summary: Get an organization's funding balance
      operationId: getOrganizationFundingBalance
      security:
        - Bearer: [ ]
      description: >-
        Returns the organization's available funding balance. The value can be
        up to 2 minutes old.
      parameters:
        - name: uniqueId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationBalance'
        '401':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organization/{orgId}/webhooks:
    get:
      tags:
        - Organization > Webhook
      operationId: listWebhooks
      security:
        - Bearer: [ ]
      summary: List organization webhooks
      description: Returns a list of configured webhooks.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookRead'
        '401':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Organization not found.
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Organization > Webhook
      operationId: createWebhook
      security:
        - Bearer: [ ]
      summary: Create a webhook
      description: Create a webhook.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/WebhookCreate'
      responses:
        '204':
          description: successful operation
        '400':
          description: Invalid properties sent.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - Active must be true or false.
        '401':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organization/{orgId}/webhooks/{webhookId}:
    get:
      tags:
        - Organization > Webhook
      operationId: getWebhook
      security:
        - Bearer: [ ]
      summary: Get Webhook
      description: Returns the requested webhook model.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
        - name: webhookId
          in: path
          required: true
          description: Webhook ID.
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookRead'
        '401':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Webhook not found.
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Organization > Webhook
      operationId: updateWebhook
      security:
        - Bearer: [ ]
      summary: Update a webhook
      description: Update a webhook. Immutable webhooks cannot be modified.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
        - name: webhookId
          in: path
          required: true
          description: Webhook ID.
          schema:
            type: integer
      requestBody:
        $ref: '#/components/requestBodies/WebhookCreate'
      responses:
        '204':
          description: successful operation
        '400':
          description: Invalid properties sent or webhook is immutable.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Webhook not found.
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Organization > Webhook
      operationId: deleteWebhook
      security:
        - Bearer: [ ]
      summary: Delete a webhook
      description: Deletes a webhook.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
        - name: webhookId
          in: path
          required: true
          description: Webhook ID.
          schema:
            type: integer
      responses:
        '204':
          description: Webhook deleted.
        '401':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Webhook not found, or it belongs to another organization.
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organization/{orgId}/webhooks/{webhookId}/logs:
    get:
      tags:
        - Organization > Webhook
      operationId: getWebhookLogs
      security:
        - Bearer: [ ]
      summary: Get Webhook Logs
      description: >-
        Returns the requested webhook logs that match the provided
        criteria. The response is limited to 100 logs per request. The status_code
        filter only returns logs where the most recent response from the
        configured server matches that HTTP Status code.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
        - name: webhookId
          in: path
          required: true
          description: Webhook ID.
          schema:
            type: integer
        - name: status_code
          in: query
          required: false
          description: >-
            The HTTP Status code of the last response of any given webhook log.
            When sent, `last_id` is ignored.
          schema:
            type: integer
        - name: last_id
          in: query
          required: false
          description: >-
            The MongoDB ObjectId of the last Webhook Log read. The response
            will start with the next Webhook Log in line. Ignored when
            `status_code` is also sent.
          schema:
            type: string
      responses:
        '200':
          description: successful operation. The body is a list of webhook logs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookLog'
        '401':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organization/{orgId}/webhooks/{webhookId}/logs/{webhookLogId}:
    get:
      tags:
        - Organization > Webhook
      operationId: viewWebhookLog
      security:
        - Bearer: [ ]
      summary: View a single webhook log
      description: View a single webhook log.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
        - name: webhookId
          in: path
          required: true
          description: Webhook ID.
          schema:
            type: integer
        - name: webhookLogId
          in: path
          required: true
          description: Webhook Log MongoDB ObjectId.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookLog'
        '401':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Webhook log not found.
        '500':
          $ref: '#/components/responses/InternalError'
  /api/organization/{orgId}/webhooks/{webhookId}/logs/{webhookLogId}/replay:
    post:
      tags:
        - Organization > Webhook
      operationId: replayWebhookLog
      security:
        - Bearer: [ ]
      summary: Replay Webhook Log
      description: >-
        Replays the Webhook. The stored request body and headers from the
        viewWebhookLog call are sent to the webhook's current URL. If the
        webhook's URL has changed since the log was written, the replay goes to
        the new URL, not the one the original request went to. This will store
        the response and return the HTTP Status code the server gave when
        replaying the webhook.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
        - name: webhookId
          in: path
          required: true
          description: Webhook ID.
          schema:
            type: integer
        - name: webhookLogId
          in: path
          required: true
          description: Webhook Log MongoDB ObjectId.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookReplayResponse'
  /api/program:
    get:
      tags:
        - Program
      summary: Retrieve program collection with optional filters
      operationId: getProgramList
      security:
        - Bearer: [ ]
      description: Returns program collection.
      parameters:
        - name: organization
          in: query
          required: false
          description: Organization unique_id to filter programs by.
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Name of program to return (LIKE search).
          schema:
            type: string
        - name: active
          in: query
          required: false
          description: Filter by active status (1 or 0).
          schema:
            type: integer
            enum: [0, 1]
        - name: published
          in: query
          required: false
          description: Filter by published status (1 or 0).
          schema:
            type: integer
            enum: [0, 1]
        - name: uri
          in: query
          required: false
          description: Filter by full domain URL (subdomain.domain).
          schema:
            type: string
        - name: organization_id
          in: query
          required: false
          description: Filter by the organization's internal numeric id.
          schema:
            type: integer
        - name: unique_id
          in: query
          required: false
          description: Filter by one or more program unique_id values.
          schema:
            type: array
            items:
              type: string
        - name: program_type
          in: query
          required: false
          description: Filter by program type name.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Request a specific page number starting with page 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Set the number of desired results per page.
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramList'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          description: Unknown exception
    post:
      tags:
        - Program
      summary: Add a new program.
      operationId: addProgram
      security:
        - Bearer: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramCreate'
        description: Program object to add to the marketplace.
        required: true
      responses:
        '201':
          description: Create a new program
