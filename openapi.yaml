          maxLength: 50
        lastname:
          type: string
          description: Contact last name.
          minLength: 1
          maxLength: 50
        phone:
          type: string
          description: Contact phone number.
          minLength: 10
          maxLength: 255
        email:
          type: string
          description: Contact email address. Must be a valid email format.
        address1:
          type: string
          description: Street address line 1.
          minLength: 1
          maxLength: 255
        address2:
          type: string
          description: Street address line 2.
          maxLength: 50
        city:
          type: string
          description: City.
          minLength: 1
          maxLength: 155
        state:
          type: string
          description: State abbreviation (e.g. NY).
          minLength: 1
          maxLength: 3
        zip:
          type: string
          description: Postal/ZIP code. Must be a valid US postal code format.
    AutoRedemption:
      type: object
