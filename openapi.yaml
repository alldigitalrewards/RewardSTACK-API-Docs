              participant_count:
                type: integer
        programTypes:
          type: array
          items:
            type: integer
    ProgramMetrics:
      description: Basic program metrics.
      type: object
      properties:
        participant_total:
          description: Total number of active participants.
          type: integer
        transaction_total:
          description: Total number of transactions.
          type: integer
        adjustment_total:
          description: Total number of point adjustments.
          type: integer
    OrganizationList:
      type: object
      description: Organization object as returned in list responses.
      properties:
        unique_id:
          type: string
          description: The unique identifier of the organization.
          minLength: 2
          maxLength: 45
          pattern: '^[a-zA-Z0-9_-]+$'
        name:
          type: string
          description: The name of the organization.
          minLength: 2
          maxLength: 50
        industry_program:
          $ref: '#/components/schemas/IndustryProgramEnum'
        program_count:
          description: The number of programs configured under this organization.
          type: integer
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        parent:
          type:
            - "string"
            - "null"
          description: Parent organization unique_id.
        domains:
          type: array
          description: Domain URLs associated with this organization.
          items:
            type: string
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type: string
          description: Last update timestamp (Y-m-d H:i:s).
    OrganizationRead:
      type: object
      description: Full organization object.
      properties:
        unique_id:
          type: string
          description: The unique identifier of the organization.
          minLength: 2
          maxLength: 45
        parent:
          type:
            - "string"
            - "null"
          description: The parent organization unique_id.
        name:
          type: string
          description: The name of the organization.
          minLength: 2
          maxLength: 50
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type: string
          description: Last update timestamp (Y-m-d H:i:s).
        domains:
          type: array
          description: >-
            Domain URLs associated with this organization. Each domain must match
            the pattern for a valid domain URL and be unique across all organizations.
          items:
            type: string
        industry_program:
          $ref: '#/components/schemas/IndustryProgramEnum'
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        program_count:
          type: integer
          description: The number of programs configured under this organization.
        company_contact:
          $ref: '#/components/schemas/Contact'
        accounts_payable_contact:
          $ref: '#/components/schemas/Contact'
    OrganizationCreate:
      type: object
      required:
        - unique_id
        - name
        - parent
      properties:
        unique_id:
          type: string
          description: >-
            The unique identifier for the organization. Alphanumeric with hyphens
            and underscores only.
          minLength: 2
          maxLength: 45
          pattern: '^[a-zA-Z0-9_-]+$'
        parent:
          type: string
          description: >-
            The parent organization unique_id. Required. Must reference an existing
            organization. Cannot create circular references.
        name:
          type: string
          description: The name of the organization.
          minLength: 2
          maxLength: 50
        domains:
          type: array
          description: >-
            Domain URLs to associate with this organization. Each must be a valid
            domain URL and unique across all organizations. Converted to lowercase.
          items:
            type: string
        industry_program:
          $ref: '#/components/schemas/IndustryProgramEnum'
        company_contact:
          $ref: '#/components/schemas/ContactWrite'
        accounts_payable_contact:
          $ref: '#/components/schemas/ContactWrite'
    OrganizationUpdate:
      type: object
      description: >-
        Organization update request body. Only include fields you wish to change.
        unique_id and parent cannot be changed on update (they will be silently ignored).
      properties:
        name:
          type: string
          description: The name of the organization.
          minLength: 1
          maxLength: 50
        domains:
          type: array
          description: >-
            Replaces all existing domains. Each must be a valid domain URL and
            unique across all organizations.
          items:
            type: string
        industry_program:
          description: >-
            Industry program type. Can only be set once; cannot be unset after initial assignment.
          $ref: '#/components/schemas/IndustryProgramEnum'
        company_contact:
          $ref: '#/components/schemas/ContactWrite'
        accounts_payable_contact:
          $ref: '#/components/schemas/ContactWrite'
    WebhookCreate:
      type: object
      required:
        - title
        - url
        - event
      properties:
        title:
          type: string
          description: Webhook title.
          minLength: 1
          maxLength: 255
        url:
          type: string
          description: >-
            URL the webhook POSTs data to. Must start with https:// and be between
            11 and 255 characters. Cannot point to private/reserved IP addresses.
          minLength: 11
          maxLength: 255
        event:
          type: string
          description: Which event triggers this webhook (e.g. Transaction.create).
          minLength: 1
          maxLength: 255
        auth_type:
          type:
            - "string"
            - "null"
          description: Authentication type for the webhook endpoint.
          enum:
            - Bearer
            - Basic
        username:
          type:
            - "string"
            - "null"
          description: Username for basic authentication.
        password:
          type:
            - "string"
            - "null"
          description: Password for basic authentication.
        active:
          type: integer
          description: Is this webhook active? 0 = false, 1 = true.
          enum: [0, 1]
        immutable:
          type: integer
          description: Can this webhook be modified? 0 = mutable, 1 = immutable.
          enum: [0, 1]
    WebhookRead:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier of the webhook.
        title:
          type: string
          description: Webhook title.
        url:
          type: string
          description: URL the webhook POSTs data to.
        event:
          type: string
          description: Which event triggers this webhook.
        auth_type:
          type:
            - "string"
            - "null"
          description: Authentication type (Bearer or Basic).
        active:
          type: integer
          description: Is this webhook active? 0 = false, 1 = true.
          enum: [0, 1]
        immutable:
          type: integer
          description: Can this webhook be modified? 0 = mutable, 1 = immutable.
          enum: [0, 1]
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
    WebhookLogs:
      type: object
      properties:
        webhookLogs:
          type: array
          items:
            $ref: '#/components/schemas/WebhookLog'
    WebhookLog:
      type: object
      properties:
        _id:
          type: object
          properties:
            $oid:
              type: string
              description: MongoDB ObjectId.
        request_time:
          type: object
        http_status:
          type: integer
          description: >-
            Most recent HTTP status response from the webhook's last attempt.
        responses:
          type: array
          items:
            $ref: '#/components/schemas/httpResponse'
        request:
          $ref: '#/components/schemas/httpRequest'
    WebhookReplayResponse:
      type: object
      properties:
        http_status_code:
          description: >-
            The HTTP response status code from the server the webhook was replayed to,
            or the string "Failed" if the connection failed.
          oneOf:
            - type: integer
            - type: string
              enum: ["Failed"]
    httpRequest:
      type: object
      properties:
        headers:
          type: object
          description: Request headers (Authorization header is stripped).
        body:
          type: string
    httpResponse:
      allOf:
        - $ref: '#/components/schemas/httpRequest'
        - type: object
          properties:
            http_status:
              type: integer
    CreateTransaction:
      type: object
      required:
        - products
      properties:
        products:
          type: array
          description: Array of products for the transaction. At least one product is required.
          items:
            $ref: '#/components/schemas/ProductForTransaction'
        issue_points:
          type: boolean
          description: >-
            When true, credits the participant with enough points to cover the
            transaction cost before processing. Defaults to false.
          default: false
        shipping:
          $ref: '#/components/schemas/Address'
        email_address:
          type: string
          description: >-
            Email address for the transaction. Must be a valid email.
            Required for digital products if participant has no email on file.
        phone:
          type: string
          description: Phone number for the transaction. Must be a valid phone number if provided.
        unique_id:
          type: string
          description: Optional transaction unique identifier.
        transaction_source:
          type: string
          description: >-
            Transaction source identifier. Reserved values (AUTO_REDEMPTION,
            MARKETPLACE, CUSTOMER_SERVICE, GAMES, KIA_KASH, REDEMPTION_CAMPAIGNS,
            SWEEPSTAKE) cannot be used unless the caller is a superadmin.
        avs_disabled:
          type: boolean
          description: >-
            When true, disables Address Verification Service for this transaction
            even if the program has AVS enabled. Defaults to false.
          default: false
        meta:
          type: array
          items:
            $ref: '#/components/schemas/Meta'
    Transaction:
      type: object
      properties:
        id:
          type: integer
        unique_id:
          type: string
        participant_id:
          type: integer
        wholesale:
          type: number
          format: float
        subtotal:
          type: number
          format: float
        total:
          type: number
          format: float
        points:
          type: number
          format: float
          description: Total points cost (total * program point ratio).
        email_address:
          type: string
        phone:
          type: string
        type:
          type: integer
          description: Transaction type.
        status:
          type: string
          description: Transaction status.
        created_at:
          type: string
        updated_at:
          type: string
        shipping:
          $ref: '#/components/schemas/TransactionAddressRead'
        meta:
          type: array
          items:
            $ref: '#/components/schemas/Meta'
        products:
          type: array
          items:
            $ref: '#/components/schemas/TransactionProductRead'
        user:
          $ref: '#/components/schemas/ParticipantRead'
    TransactionProductRead:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        quantity:
          type: integer
        total:
          type: number
          format: float
        points:
          type: number
          format: float
        guid:
          type: string
          description: Unique GUID for this transaction item.
        reissue_date:
          type: string
          description: Reissue date (YYYY-MM-DD).
        returned:
          type: integer
          description: 1 if item has been returned, 0 if not.
          enum: [0, 1]
        var_amount:
          type: number
          format: float
          description: Variable amount for ranged-price products.
        program_fee:
          type: number
          format: float
        terms_approved:
          type: string
        is_digital:
          type: integer
          description: 1 for digital, 0 for physical.
          enum: [0, 1]
        is_wallet_enabled:
          type: integer
          description: 1 if wallet enabled, 0 if not.
          enum: [0, 1]
    ProductForTransaction:
      type: object
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
          description: Product SKU (converted to uppercase).
        quantity:
          type: integer
          description: Quantity to order. Must be greater than 0.
          minimum: 1
        amount:
          type: number
          description: >-
            Required for ranged-price products. The dollar amount to apply.
            Must be within the product's min/max price range.
    ParticipantIdArray:
      type: object
      required:
        - participant_id
      properties:
        participant_id:
          type: array
          description: Array of participant unique IDs to fetch.
          items:
            type: string
          example:
            - UNIQUE_ID1
            - UNIQUE_ID2
            - UNIQUE_ID3
    Meta:
      type: object
      description: A single key-value metadata pair. The key is the property name and the value is its value.
      additionalProperties:
        type: string
      example:
        department: "Engineering"
    ProductSku:
      type: string
    Address:
      type: object
      properties:
        firstname:
          type: string
          description: Recipient first name. Required for physical product shipments.
        lastname:
          type: string
          description: Recipient last name.
        address1:
          type: string
          description: Street address line 1.
        address2:
          type: string
          description: Street address line 2.
        city:
          type: string
          description: City.
        state:
          type: string
          description: State abbreviation (e.g. NY). Required for US shipments with physical items.
        zip:
          type: string
          description: Postal/ZIP code.
        country_code:
          type: string
          description: Two-letter country code (e.g. US, CA).
          maxLength: 2
          default: US
    TransactionAddressRead:
      type: object
      properties:
        firstname:
          type: string
        lastname:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
          description: Country name or code.
        country_code:
          type: string
          description: Two-letter country code.
    PointRead:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: number
          description: >-
            Point amount (displayed as amount * program point ratio).
        type:
          type: string
          description: '"credit" to add points, "debit" to subtract points.'
          enum:
            - credit
            - debit
        reference:
          type: string
          description: Reference identifier for client internal use.
        description:
          type: string
          description: Description visible to the participant.
        shareable:
          type: integer
          description: >-
            1 indicates the adjustment affects shareable points, 0 indicates
            it affects earned (non-shareable) points. Shareable points can
            be transferred to other participants when point sharing is enabled.
          enum: [0, 1]
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type: string
          description: Last update timestamp (Y-m-d H:i:s).
        transaction_id:
          type:
            - "integer"
            - "null"
          description: Associated transaction ID, null for manual adjustments.
        transaction_item_id:
          type:
            - "integer"
            - "null"
        completed_at:
          type:
            - "string"
            - "null"
          description: Date the activity was completed (YYYY-MM-DD).
        activity:
          type:
            - "string"
            - "null"
          description: Activity label for the adjustment.
        status:
          type: string
          description: Adjustment status.
    PointReadWithUser:
      allOf:
        - $ref: '#/components/schemas/PointRead'
        - type: object
          properties:
            user:
              $ref: '#/components/schemas/ParticipantRead'
    PointWrite:
      type: object
      required:
        - amount
        - type
      properties:
        amount:
          type: number
          description: >-
            Point amount. Must be positive and non-empty. Credit adjustments
            cannot cause the total to exceed 99999999.99.
          minimum: 0
          exclusiveMinimum: true
        type:
          type: string
          description: '"credit" to add points, "debit" to subtract points.'
          enum:
            - credit
            - debit
        reference:
          type: string
          description: Reference identifier for client use.
        completed_at:
          type: string
          description: >-
            YYYY-MM-DD. Optional reference to the date a participant completed
            the activity to receive the points. This can be used if the date
            the points are credited via the API is after the date the
            participant earned the points.
        description:
          type: string
          description: Description visible to participant.
        activity:
          type: string
          description: Activity label for the adjustment.
        shareable:
          type: integer
          description: >-
            Set to 1 to mark this adjustment as shareable. Shareable points
            are added to the participant's shared_credit balance and can be
            transferred to other participants. Requires point_sharing to be
            enabled on the program. Default is 0 (non-shareable).
          enum: [0, 1]
          default: 0
    PointUpdate:
      type: object
      description: >-
        Update adjustment metadata. Amount and type cannot be changed after creation.
      properties:
        reference:
          type: string
          description: Reference identifier for client use.
        completed_at:
          type: string
          description: >-
            YYYY-MM-DD. Optional reference to the date a participant completed
            the activity to receive the points.
        description:
          type: string
          description: Description visible to participant.
        activity:
          type: string
          description: Activity label for the adjustment.
    SharePointsRequest:
      type: object
      description: Request body for sharing points between participants.
      required:
        - recipient_email
        - amount
      properties:
        recipient_email:
          type: string
          format: email
          description: >-
            Email address of the participant receiving the points. Must be
            an active participant in the same program as the sharer.
        amount:
          type: number
          minimum: 0.01
          description: >-
            Amount of shareable points to transfer. Must be greater than zero
            and cannot exceed the sharer's shared_credit balance.
        message:
          type: string
          maxLength: 255
          description: >-
            Optional message to accompany the share. Trimmed and truncated to
            255 characters.
    SharePointsResponse:
      type: object
      description: Response body after successfully sharing points.
      properties:
        credit:
          type: number
          description: The sharer's remaining earned (non-shareable) point balance.
        shared_credit:
          type: number
          description: The sharer's remaining shareable point balance after the transfer.
