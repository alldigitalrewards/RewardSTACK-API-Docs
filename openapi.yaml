        - name: transactionGuid
          in: path
          required: true
          description: GUID of a transaction item.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction_id:
                    type: integer
                  participant_unique_id:
                    type: string
                  program_unique_id:
                    type: string
                  guid:
                    type: string
                    description: The transaction item GUID from the path.
        '400':
          description: The caller's token does not have access to participant data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: User does not have access to Participant Data
        '404':
          description: No transaction item matches the given GUID.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - Transaction not found for the provided GUID
        '500':
          description: >-
            Unexpected error. The body is a list of strings, not the usual
            error object.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - An unexpected error occurred
