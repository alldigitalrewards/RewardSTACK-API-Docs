          type: integer
          description: 1 is true 0 is false
        issuance_email_enabled:
          type: integer
          description: >-
            1 is true 0 is false. When enabled, participants receive an email
            when they are enrolled in the award.
        issuance_email_template:
          type: string
          description: HTML email template sent when a participant is enrolled.
        fulfillment_email_template:
          type:
            - "string"
            - "null"
          description: HTML email template sent when a reward is fulfilled.
        sent_from:
          type:
            - "string"
            - "null"
          description: Email address used as the sender for award notifications.
        issuance_subject:
          type:
            - "string"
            - "null"
          description: Subject line for issuance notification emails.
        fulfillment_subject:
          type:
            - "string"
            - "null"
          description: Subject line for fulfillment notification emails.
        changelog:
          type: array
          description: Audit trail of changes made to the award after creation.
          items:
            type: object
            properties:
              changed_at:
                type: string
              changes:
                type: object
                description: Map of changed field name to {from, to} values.
        created_at:
          type: string
          description: Datetime the award was created.
        updated_at:
          type: string
          description: Datetime the award was last updated.
    ServiceAwardDetail:
      type: object
      description: >-
        A service award as returned by the single-award GET. Adds the lock
        fields, which are only computed on this operation.
      properties:
        is_locked:
          type: boolean
          description: >-
            True once the award has a completed fulfillment. When true,
            reward_type, reward_value, is_trigger_yearly, interval,
            issuance_time, and timezone can no longer be changed.
        lock_reason:
          type:
            - "string"
            - "null"
          description: Explanation shown when is_locked is true, otherwise null.
      allOf:
        - $ref: '#/components/schemas/ServiceAward'
    ServiceAwardCreate:
      type: object
      required:
        - name
        - reward_type
        - reward_value
        - is_trigger_yearly
        - active
      properties:
        name:
          type: string
          description: Display name of the service award.
        reward_type:
          type: integer
          description: 1 = points, 2 = product SKU.
          enum: [1, 2]
        reward_value:
          type: string
          description: >-
            The reward amount. For points this is the number of points to issue.
            For SKU this is the product SKU to fulfill.
        is_trigger_yearly:
          type: boolean
          description: >-
            When true the award triggers every year on the participant's
            milestone date. When false it triggers once at the configured
            interval.
        interval:
          type: integer
          description: >-
            Number of days between award triggers. Required when
            is_trigger_yearly is false.
        active:
          type: integer
          description: 1 is true 0 is false
          enum: [0, 1]
        issuance_time:
          type: string
          description: Time of day to issue the award (HH:mm, 24-hour format).
          example: "09:00"
        timezone:
          type: string
          description: Timezone for the issuance time (e.g. America/New_York).
        issuance_email_enabled:
          type: integer
          description: 1 is true 0 is false. Defaults to enabled.
          default: 1
        issuance_email_template:
          type: string
          description: HTML email template sent when a participant is enrolled.
        fulfillment_email_template:
          type: string
          description: HTML email template sent when a reward is fulfilled.
        sent_from:
          type: string
          format: email
          description: Email address used as the sender for award notifications.
        issuance_subject:
          type: string
          description: Subject line for issuance notification emails.
        fulfillment_subject:
          type: string
          description: Subject line for fulfillment notification emails.
    ServiceAwardUpdate:
      type: object
      description: >-
        All fields are optional. Only include the fields you wish to change.
        reward_type and reward_value must be sent together; sending only one
        of the two is a 400. Once the award has a completed fulfillment,
        reward_type, reward_value, is_trigger_yearly, interval,
        issuance_time, and timezone can no longer be changed. name, active,
        and the email fields can still be changed at any time.
      properties:
        name:
          type: string
        reward_type:
          type: integer
          enum: [1, 2]
        reward_value:
          type: string
        is_trigger_yearly:
          type: boolean
        interval:
          type: integer
        active:
          type: integer
          enum: [0, 1]
        issuance_time:
          type: string
          example: "09:00"
        timezone:
          type: string
        issuance_email_enabled:
          type: integer
        issuance_email_template:
          type: string
        fulfillment_email_template:
          type: string
        sent_from:
          type: string
          format: email
        issuance_subject:
          type: string
        fulfillment_subject:
          type: string
    ServiceAwardParticipant:
      type: object
      description: A participant enrolled in a service award.
      properties:
        id:
          type: string
          format: uuid
        participant_id:
          type: string
          description: The unique identifier of the participant.
        service_award_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: The participant's milestone date (e.g. hire date). YYYY-MM-DD.
        created_at:
          type: string
        updated_at:
          type: string
        fulfillments:
          type: array
          description: History of reward fulfillments for this participant.
          items:
            $ref: '#/components/schemas/ServiceAwardFulfillment'
        most_recent_reward_date:
          type:
            - "string"
            - "null"
          format: date
          description: Date of the most recent fulfilled reward.
        next_reward_date:
          type:
            - "string"
            - "null"
          format: date
          description: Projected date of the next reward.
    ServiceAwardFulfillment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        anniversary_date:
          type: string
          format: date
          description: The participant's milestone date, adjusted to the year this fulfillment is for.
        processed_at:
          type:
            - "string"
            - "null"
          description: Datetime the fulfillment was processed.
        reward:
          type: string
          description: The reward type label (POINTS or SKU).
          enum:
            - POINTS
            - SKU
        reward_value:
          type: string
        reward_status:
          type: string
          description: >-
            Current status of the fulfillment. pending: not yet attempted.
            retrying: the reward could not be issued and it will be tried
            again. processed: the reward was issued. failed: the
            fulfillment will not be retried.
          enum:
            - pending
            - retrying
            - processed
            - failed
        failure_reason:
          type:
            - "string"
            - "null"
          description: Error message from the most recent failed reward attempt.
        email_sent_at:
          type:
            - "string"
            - "null"
          description: Datetime the fulfillment email was sent.
        email_retry_count:
          type: integer
          description: Number of times sending the fulfillment email has been retried.
        email_skipped_at:
          type:
            - "string"
            - "null"
          description: Datetime the fulfillment email was skipped.
        email_failed_at:
          type:
            - "string"
            - "null"
          description: Datetime the fulfillment email failed to send.
        created_at:
          type: string
        updated_at:
          type: string
    ServiceAwardParticipantWrite:
      type: object
      required:
        - participant_id
        - date
      properties:
        participant_id:
          type: string
          description: The unique identifier of the participant to enroll.
        date:
          type: string
          format: date
          description: >-
            The participant's milestone date (e.g. hire date) in YYYY-MM-DD
            format. This date is used to calculate when rewards should be issued.
    ServiceAwardBulkResponse:
      type: object
      description: Summary of a bulk participant enrollment operation.
      properties:
        status:
          type: string
          description: Overall status of the operation.
          example: completed
        summary:
          type: object
          properties:
            total_participants:
              type: integer
              description: Total number of participants in the request.
            successful:
              type: integer
              description: Number of participants successfully enrolled.
            failed:
              type: integer
              description: Number of participants that failed validation.
        errors:
          type: array
          description: Details about failed enrollments. Empty when all succeed.
          items:
            type: object
            properties:
              participant_id:
                type: string
              error_type:
                type: string
                description: Category of the error.
                enum:
                  - validation_error
                  - email_processing_error
              error_message:
                type: string
