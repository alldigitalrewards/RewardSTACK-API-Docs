  /api/program/{programId}/participant/{uniqueId}:
    get:
      tags:
        - Participant
      summary: Find a participant by ID
      operationId: getUser
      security:
        - Bearer: [ ]
      description: Returns a single participant with full details including address and meta.
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of participant to return.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantRead'
        '400':
          description: The uniqueId path value is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Invalid participant ID
        '401':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            Resource does not exist. No response body when the program itself
            does not exist; a message body when the program exists but the
            participant does not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Resource does not exist
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Participant
      summary: Update a participant.
      operationId: updateUser
      security:
        - Bearer: [ ]
      description: >-
        Update participant properties. Cannot modify unique_id, program, organization, or credit.
        Meta data sent here is merged into existing meta (upsert): keys omitted
        from the request are left unchanged, not deleted. For a true full
        replace that deletes omitted keys, use PUT on the dedicated /meta
        endpoint instead. PATCH on this same path behaves identically to PUT.
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of participant to update.
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/UserWrite'
      responses:
        '200':
          description: Participant updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantRead'
        '400':
          description: Validation error, including a malformed uniqueId path value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    description: An object keyed by field name when the body fails validation.
              example:
                message: Invalid participant ID
        '401':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No response body when the program itself does not exist.
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          description: Unknown exception
    patch:
      tags:
        - Participant
      summary: Update a participant (alias of PUT).
      operationId: patchUser
      security:
        - Bearer: [ ]
      description: >-
        Identical to PUT on this same path, including the meta-merge
        behavior: existing meta keys omitted from the request are left
        unchanged, not deleted.
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of participant to update.
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/UserWrite'
      responses:
        '200':
          description: Participant updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantRead'
        '400':
          description: Validation error, including a malformed uniqueId path value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    description: An object keyed by field name when the body fails validation.
              example:
                message: Invalid participant ID
        '401':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No response body when the program itself does not exist.
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          description: Unknown exception
    delete:
      tags:
        - Participant
      summary: Delete participant (GDPR PII removal)
      operationId: deleteUser
      security:
        - Bearer: [ ]
      description: >-
        Removes participant PII (firstname, lastname, email, phone, birthdate, address).
        Sets status to DATADEL and active to 0. This is irreversible — no further updates
        can be made to DATADEL participants.
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of participant to delete.
          schema:
            type: string
      responses:
        '204':
          description: Participant PII removed.
        '400':
          description: The uniqueId path value is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Invalid participant ID
        '401':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
