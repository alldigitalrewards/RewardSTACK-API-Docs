  /api/program/{programId}/participant/{uniqueId}/share:
    post:
      tags:
        - point sharing
      summary: Share points with another participant
      description: >-
        Transfer shareable points from one participant to another within the
        same program. The sharer must have sufficient shareable points
        (shared_credit balance) and point_sharing must be enabled on the
        program. Both participants must be active.
      operationId: sharePoints
      security:
        - Bearer: [ ]
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program Unique Identifier.
          schema:
            type: string
            format: uuid
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of the participant sharing points.
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharePointsRequest'
        description: Point sharing request details.
        required: true
      responses:
        '201':
          description: Points shared successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePointsResponse'
        '400':
          description: >-
            Bad request. Returned for all error cases, including when the
            sharer participant does not exist ("Resource does not exist").
            Other reasons: insufficient shareable points, recipient not found
            in the program, cannot share with yourself, recipient is inactive,
            amount must be greater than zero, point sharing is not enabled on
            the program, or a configured sharing limit (per transaction,
            daily, weekly, monthly, or total) has been reached.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    description: A list of one or more validation error messages.
                    items:
                      type: string
                    example:
                      - "Insufficient shareable points"
                  - type: object
                    description: >-
                      Returned when a configured program sharing limit is
                      reached. Adds the maximum amount the participant may
                      currently share and which threshold is limiting it.
                    properties:
                      errors:
                        type: array
                        items:
                          type: string
                      max_shareable:
                        type: number
                        description: >-
                          The maximum amount the participant can currently
                          share given the limiting threshold.
                      limiting_threshold:
                        type: string
                        nullable: true
                        description: >-
                          Which configured limit is being hit (for example
                          per_transaction, daily, weekly, monthly, total, or
                          balance). May be null.
        default:
          description: Unknown exception
  /api/program/{programId}/participant/{uniqueId}/sso:
