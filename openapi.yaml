            clear the limit. Preserved if omitted.
        share_monthly_max:
          type: number
          nullable: true
          description: >-
            Maximum amount a participant may share per month. Send null to
            clear the limit. Preserved if omitted.
        published:
          type: integer
          description: 1 is published, 0 is unpublished.
          enum: [0, 1]
        start_date:
          type: string
          description: Program start date (YYYY-MM-DD).
        end_date:
          type: string
          description: Program end date (YYYY-MM-DD HH:MM:SS).
        grace_period:
          type: integer
          description: Days after end_date that the program remains active.
        enable_email_login:
          type: integer
          description: 0 = Disabled, 1 = enabled.
          enum: [0, 1]
        timezone:
          type: string
          description: Program timezone. Must be a valid timezone ID.
        collect_ssn:
          type: integer
          enum: [0, 1]
        is_avs:
          type: integer
          enum: [0, 1]
        deposit_amount:
          type: number
        low_level_deposit:
          type: number
        issue_1099:
          type: integer
          enum: [0, 1]
        employee_payroll_file:
          type: integer
          enum: [0, 1]
        cost_center_id:
          type: string
          maxLength: 45
        accounting_id:
          type:
            - "string"
            - "null"
          description: Only superadmin/accounting roles can modify this.
          maxLength: 45
        contact:
          $ref: '#/components/schemas/ContactWrite'
        accounting_contact:
          $ref: '#/components/schemas/ContactWrite'
        auto_redemption:
          type: object
          properties:
            product_sku:
              type: string
            active:
              type: integer
              enum: [0, 1]
            all_participant:
              type: integer
              enum: [0, 1]
        one_time_auto_redemptions:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
              active:
                type: integer
