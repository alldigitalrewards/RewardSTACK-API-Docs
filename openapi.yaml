      description: >-
        Update an existing point adjustment. No single property in the body is
        required when updating. All properties not listed here will be ignored.
        Only metadata fields can be updated — amount and type cannot be changed.
        If activity is left out of the body, it is set to an empty string
        rather than left unchanged; send the adjustment's current activity
