              schema:
                oneOf:
                  - type: array
                    description: A list of one or more validation error messages.
                    items:
                      type: string
                  - $ref: '#/components/schemas/MessageResponse'
              example:
                message: Participant not active
        '401':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            No response body when the program itself does not exist. A body
            is returned when the participant or the adjustment does not
            exist.
          content:
            application/json:
              schema:
