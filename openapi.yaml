        - name: unique_id
          in: query
          required: false
          description: Filter by participant unique_id (prefix search).
          schema:
            type: string
        - name: active
          in: query
          required: false
          description: Filter by active status (0 or 1).
          schema:
            type: integer
            enum: [0, 1]
        - name: status
          in: query
          required: false
          description: Filter by participant status.
