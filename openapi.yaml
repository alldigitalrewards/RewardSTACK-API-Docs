openapi: 3.0.0
info:
  version: '2.14.1'
  title: ADR Marketplace Platform
  description: ADR marketplace management API.
  contact:
    email: technology@alldigitalrewards.com
servers:
  - url: https://admin.stage.alldigitalrewards.com
    description: Staging environment
  - url: https://admin.alldigitalrewards.com
    description: Production environment
tags:
  - name: token
    description: >-
      Generate a JSON Web Token for use in API access. This token is valid
      for 2 hours after creation by default.
  - name: organization
    description: Operations for organization management and review.
  - name: program
    description: Operations for program management and review.
  - name: Participant
    description: Operations for participant management and review.
  - name: Participant > Point Adjustment
    description: Credit or Debit Points from Participants.
  - name: Participant > SSO
    description: Generate Single Sign On URL for Participants.
  - name: Participant > Transaction
    description: Operations for transaction management and review.
  - name: webhook
    description: Operations for webhook management and review.
paths:
  /token:
    post:
      tags:
        - token
      summary: Use Basic authentication to generate a new JWT for use in API access
      operationId: generateToken
      security:
        - BasicAuth: [ ]
      parameters:
        - name: hoursUntilExpiry
          in: query
          required: false
          description: Number of hours until the token expires.
          schema:
            type: integer
            minimum: 1
            maximum: 8760
            default: 2
        - name: tokenName
          in: query
          required: false
          description: Optional name for the token.
          schema:
            type: string
            maxLength: 255
      responses:
        '201':
          description: JWT is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example:
                  - "The hoursUntilExpiry parameter must be an integer."
                  - "The maximum token duration is 8760 hours (1 year)."
        '401':
          description: Unauthorized Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          description: Unknown exception
  /api/organization:
    get:
      tags:
        - organization
      summary: Retrieve organization collection with optional filters
      operationId: getOrganizationList
      security:
        - Bearer: [ ]
      description: Returns organization collection.
      parameters:
        - name: parent
          in: query
          required: false
          description: Return all children organizations of this parent unique identifier.
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Fuzzy match on the name of organization to return.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Request a specific page number starting with page 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Set the number of desired results per page.
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationList'
        default:
          description: Unknown exception
    post:
      tags:
        - organization
      summary: Add a new organization.
      operationId: addOrganization
      security:
        - Bearer: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
        description: Organization object to add to the marketplace.
        required: true
      responses:
        '201':
          description: Create a new organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRead'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
        default:
          description: Unknown exception
  /api/organization/{uniqueId}:
    get:
      tags:
        - organization
      operationId: getOrganization
      security:
        - Bearer: [ ]
      summary: Find an organization by ID
      description: Returns a single organization.
      parameters:
        - name: uniqueId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRead'
        '404':
          description: Organization not found
    put:
      tags:
        - organization
      summary: Update an organization.
      operationId: updateOrganization
      security:
        - Bearer: [ ]
      parameters:
        - name: uniqueId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
        description: Organization properties to update. Only include fields you wish to change.
        required: true
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRead'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
        default:
          description: Unknown exception
  /api/organization/{orgId}/webhooks:
    get:
      tags:
        - webhook
      operationId: listWebhooks
      security:
        - Bearer: [ ]
      summary: List organization webhooks
      description: Returns a list of configured webhooks.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookRead'
        '404':
          description: Organization not found.
    post:
      tags:
        - webhook
      operationId: createWebhook
      security:
        - Bearer: [ ]
      summary: Create a webhook
      description: Create a webhook.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/WebhookCreate'
      responses:
        '204':
          description: successful operation
        '400':
          description: Invalid properties sent.
  /api/organization/{orgId}/webhooks/{webhookId}:
    get:
      tags:
        - webhook
      operationId: getWebhook
      security:
        - Bearer: [ ]
      summary: Get Webhook
      description: Returns the requested webhook model.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
        - name: webhookId
          in: path
          required: true
          description: Webhook ID.
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookRead'
        '404':
          description: Webhook not found.
    put:
      tags:
        - webhook
      operationId: updateWebhook
      security:
        - Bearer: [ ]
      summary: Update a webhook
      description: Update a webhook. Immutable webhooks cannot be modified.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
        - name: webhookId
          in: path
          required: true
          description: Webhook ID.
          schema:
            type: integer
      requestBody:
        $ref: '#/components/requestBodies/WebhookCreate'
      responses:
        '204':
          description: successful operation
        '400':
          description: Invalid properties sent or webhook is immutable.
        '404':
          description: Webhook not found.
  /api/organization/{orgId}/webhooks/{webhookId}/logs:
    get:
      tags:
        - webhook
      operationId: getWebhookLogs
      security:
        - Bearer: [ ]
      summary: Get Webhook Logs
      description: >-
        Returns the requested webhook logs that match the provided
        criteria. The response is limited to 100 logs per request. The status_code
        filter only returns logs where the most recent response from the
        configured server matches that HTTP Status code.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
        - name: webhookId
          in: path
          required: true
          description: Webhook ID.
          schema:
            type: integer
        - name: status_code
          in: query
          required: false
          description: The HTTP Status code of the last response of any given webhook log.
          schema:
            type: integer
        - name: last_id
          in: query
          required: false
          description: >-
            The MongoDB ObjectId of the last Webhook Log read. The response
            will start with the next Webhook Log in line.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookLogs'
  /api/organization/{orgId}/webhooks/{webhookId}/logs/{webhookLogId}:
    get:
      tags:
        - webhook
      operationId: viewWebhookLog
      security:
        - Bearer: [ ]
      summary: View a single webhook log
      description: View a single webhook log.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
        - name: webhookId
          in: path
          required: true
          description: Webhook ID.
          schema:
            type: integer
        - name: webhookLogId
          in: path
          required: true
          description: Webhook Log MongoDB ObjectId.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookLog'
        '404':
          description: Webhook log not found.
  /api/organization/{orgId}/webhooks/{webhookId}/logs/{webhookLogId}/replay:
    post:
      tags:
        - webhook
      operationId: replayWebhookLog
      security:
        - Bearer: [ ]
      summary: Replay Webhook Log
      description: >-
        Replays the Webhook. This repeats the stored request exactly
        as you see it in the viewWebhookLog call. This will store the response and
        return the HTTP Status code the server gave when replaying the webhook.
      parameters:
        - name: orgId
          in: path
          required: true
          description: The organization unique_id.
          schema:
            type: string
        - name: webhookId
          in: path
          required: true
          description: Webhook ID.
          schema:
            type: integer
        - name: webhookLogId
          in: path
          required: true
          description: Webhook Log MongoDB ObjectId.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookReplayResponse'
  /api/program:
    get:
      tags:
        - program
      summary: Retrieve program collection with optional filters
      operationId: getProgramList
      security:
        - Bearer: [ ]
      description: Returns program collection.
      parameters:
        - name: organization
          in: query
          required: false
          description: Organization unique_id to filter programs by.
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Name of program to return (LIKE search).
          schema:
            type: string
        - name: active
          in: query
          required: false
          description: Filter by active status (1 or 0).
          schema:
            type: integer
            enum: [0, 1]
        - name: published
          in: query
          required: false
          description: Filter by published status (1 or 0).
          schema:
            type: integer
            enum: [0, 1]
        - name: uri
          in: query
          required: false
          description: Filter by full domain URL (subdomain.domain).
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Request a specific page number starting with page 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Set the number of desired results per page.
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramList'
        default:
          description: Unknown exception
    post:
      tags:
        - program
      summary: Add a new program.
      operationId: addProgram
      security:
        - Bearer: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramCreate'
        description: Program object to add to the marketplace.
        required: true
      responses:
        '201':
          description: Create a new program
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramRead'
        '400':
          description: Validation error
        default:
          description: Unknown exception
  /api/program/{uniqueId}:
    get:
      tags:
        - program
      summary: Find a program by ID
      operationId: getProgram
      security:
        - Bearer: [ ]
      description: Returns a single program.
      parameters:
        - name: uniqueId
          in: path
          required: true
          description: The Program unique_id or full domain (subdomain.domain).
          schema:
            type: string
        - name: lang
          in: query
          required: false
          description: Language code for product criteria localization.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramRead'
        '404':
          description: Program not found
        default:
          description: Unknown exception
    put:
      tags:
        - program
      summary: Update a program.
      operationId: updateProgram
      security:
        - Bearer: [ ]
      parameters:
        - name: uniqueId
          in: path
          required: true
          description: The Program unique_id or full domain (subdomain.domain).
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramUpdate'
        description: Program properties to update. Only include fields you wish to change.
        required: true
      responses:
        '200':
          description: Program updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramRead'
        '400':
          description: Validation error
        default:
          description: Unknown exception
  /api/program/{uniqueId}/metrics:
    get:
      tags:
        - program
      summary: Fetch basic program metrics
      operationId: getProgramMetrics
      security:
        - Bearer: [ ]
      description: Returns basic program metrics.
      parameters:
        - name: uniqueId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramMetrics'
        default:
          description: Unknown exception
  /api/program/{programId}/participant:
    get:
      tags:
        - Participant
      summary: Retrieve participant collection with optional filters
      operationId: getParticipantList
      security:
        - Bearer: [ ]
      description: Returns participant collection.
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Filter by first/last name or combined name (substring search).
          schema:
            type: string
        - name: email_address
          in: query
          required: false
          description: Filter by email address (substring search).
          schema:
            type: string
        - name: unique_id
          in: query
          required: false
          description: Filter by participant unique_id (prefix search).
          schema:
            type: string
        - name: active
          in: query
          required: false
          description: Filter by active status (0 or 1).
          schema:
            type: integer
            enum: [0, 1]
        - name: status
          in: query
          required: false
          description: Filter by participant status.
          schema:
            $ref: '#/components/schemas/UserStatusEnum'
        - name: points_greater_than
          in: query
          required: false
          description: Filter by minimum credit balance.
          schema:
            type: number
        - name: metaKey
          in: query
          required: false
          description: Filter by meta data key name (use with metaValue).
          schema:
            type: string
        - name: metaValue
          in: query
          required: false
          description: Filter by meta data value (use with metaKey).
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Request a specific page number starting with page 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Set the number of desired results per page.
          schema:
            type: integer
            default: 30
            maximum: 500
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserList'
        default:
          description: Unknown exception
    post:
      tags:
        - Participant
      summary: Add a new participant.
      operationId: addUser
      security:
        - Bearer: [ ]
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/UserWrite'
      responses:
        '201':
          description: Participant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantRead'
        '400':
          description: Validation error
        default:
          description: Unknown exception
  /api/program/{programId}/participant/list:
    post:
      tags:
        - Participant
      summary: Bulk Fetch Participants by Unique ID
      operationId: getBulkParticipantList
      security:
        - Bearer: [ ]
      description: Returns participant collection matching the provided unique IDs. Limited to 500 results.
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantIdArray'
        description: >-
          Array of participant_id to request. The request header
          content-type must be application/json.
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserList'
        '400':
          description: participant_id collection must be provided.
        default:
          description: Unknown exception
  /api/program/{programId}/participant/{uniqueId}:
    get:
      tags:
        - Participant
      summary: Find a participant by ID
      operationId: getUser
      security:
        - Bearer: [ ]
      description: Returns a single participant with full details including address and meta.
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of participant to return.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantRead'
        '404':
          description: Resource does not exist.
    put:
      tags:
        - Participant
      summary: Update a participant.
      operationId: updateUser
      security:
        - Bearer: [ ]
      description: >-
        Update participant properties. Cannot modify unique_id, program, organization, or credit.
        Meta data is completely replaced (PUT semantics). Use PATCH on the /meta endpoint to merge instead.
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of participant to update.
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/UserWrite'
      responses:
        '200':
          description: Participant updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantRead'
        '400':
          description: Validation error
        default:
          description: Unknown exception
    delete:
      tags:
        - Participant
      summary: Delete participant (GDPR PII removal)
      operationId: deleteUser
      security:
        - Bearer: [ ]
      description: >-
        Removes participant PII (firstname, lastname, email, phone, birthdate, address).
        Sets status to DATADEL and active to 0. This is irreversible — no further updates
        can be made to DATADEL participants.
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of participant to delete.
          schema:
            type: string
      responses:
        '204':
          description: Participant PII removed.
        '404':
          description: Participant not found.
  /api/program/{programId}/participant/{uniqueId}/transaction:
    get:
      tags:
        - Participant > Transaction
      summary: Retrieve list of participant transactions
      operationId: getTransactionList
      security:
        - Bearer: [ ]
      description: Returns a transaction collection.
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of the participant.
          schema:
            type: string
        - name: unique_id[]
          in: query
          required: false
          description: An array of one or more transaction unique_id's to filter by.
          schema:
            type: array
            items:
              type: string
        - name: year
          in: query
          required: false
          description: Filter by year (YYYY). Must be > 2015 and <= current year.
          schema:
            type: integer
            minimum: 2016
        - name: start_date
          in: query
          required: false
          description: Filter transactions from this date (Y-m-d or Y-m-d H:i:s).
          schema:
            type: string
        - name: end_date
          in: query
          required: false
          description: Filter transactions to this date (Y-m-d or Y-m-d H:i:s).
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number for pagination.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of results per page.
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '400':
          description: Invalid filter parameters.
    post:
      tags:
        - Participant > Transaction
      summary: Add a new participant transaction.
      operationId: addTransaction
      security:
        - Bearer: [ ]
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of the participant.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransaction'
        description: Transaction creation for participant.
        required: true
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: >-
            Validation error. Common reasons include: product does not exist,
            participant does not have enough points (and issue_points is not true),
            address verification failed, ranged product value exceeds valid range,
            product is out of inventory, participant is not active.
        default:
          description: Unknown exception
  /api/program/{programId}/participant/{uniqueId}/transaction/{transactionId}:
    get:
      tags:
        - Participant > Transaction
      summary: Retrieve a single transaction
      operationId: getTransaction
      security:
        - Bearer: [ ]
      description: Returns a single transaction.
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of the participant the transaction belongs to.
          schema:
            type: string
        - name: transactionId
          in: path
          required: true
          description: ID of Transaction.
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Resource does not exist.
  /api/program/{programId}/participant/{uniqueId}/transaction/{transactionId}/meta:
    patch:
      tags:
        - Participant > Transaction
      summary: Add or Update one or more meta key pair values.
      operationId: patchTransactionMeta
      security:
        - Bearer: [ ]
      description: >-
        Add or Update one or more meta key pair values. The transactionId
        property in the URL can either be a transaction Item GUID or a
        Transaction ID (integer). Either will identify the correct transaction
        and add the appropriate metadata.
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of the participant the transaction belongs to.
          schema:
            type: string
        - name: transactionId
          in: path
          required: true
          description: Transaction ID (integer) or Transaction Item GUID (string).
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/MetaArray'
      responses:
        '202':
          description: successful operation
        '400':
          description: Invalid meta or resource does not exist.
  /api/program/{programId}/participant/{uniqueId}/transaction/{transactionId}/return/{itemGuid}:
    get:
      tags:
        - Participant > Transaction
      summary: Retrieve a return
      operationId: getReturn
      security:
        - Bearer: [ ]
      description: Returns a transaction item return record.
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of the participant the transaction belongs to.
          schema:
            type: string
        - name: transactionId
          in: path
          required: true
          description: ID of Transaction.
          schema:
            type: integer
        - name: itemGuid
          in: path
          required: true
          description: GUID of Transaction Item.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRead'
        '404':
          description: Resource does not exist.
    post:
      tags:
        - Participant > Transaction
      summary: Create a return for a transaction item
      operationId: createReturn
      security:
        - Bearer: [ ]
      description: Issue a return for a transaction item. Each item can only be returned once.
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of the participant the transaction belongs to.
          schema:
            type: string
        - name: transactionId
          in: path
          required: true
          description: ID of Transaction.
          schema:
            type: integer
        - name: itemGuid
          in: path
          required: true
          description: GUID of Transaction Item to return.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  description: Optional notes for the return.
      responses:
        '201':
          description: Return created.
        '400':
          description: Item already returned or invalid request.
        '404':
          description: Resource does not exist.
  /api/program/{programId}/participant/{uniqueId}/adjustment:
    get:
      tags:
        - Participant > Point Adjustment
      summary: Retrieve list of participant adjustments
      operationId: getAdjustmentList
      security:
        - Bearer: [ ]
      description: Returns an adjustment collection.
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of the participant.
          schema:
            type: string
        - name: start_date
          in: query
          required: false
          description: Filter adjustments from this date (Y-m-d or Y-m-d H:i:s).
          schema:
            type: string
        - name: end_date
          in: query
          required: false
          description: Filter adjustments to this date (Y-m-d or Y-m-d H:i:s).
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number for pagination.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of results per page.
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PointRead'
        '400':
          description: Invalid date format.
    post:
      tags:
        - Participant > Point Adjustment
      summary: Add participant point adjustment.
      operationId: addAdjustment
      security:
        - Bearer: [ ]
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of the participant.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointWrite'
        description: Adjustment creation for participant.
        required: true
      responses:
        '201':
          description: Adjustment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointReadWithUser'
        default:
          description: Unknown exception
  /api/program/{programId}/participant/{uniqueId}/adjustment/{adjustmentId}:
    patch:
      tags:
        - Participant > Point Adjustment
      summary: Update an existing point adjustment
      description: >-
        Update an existing point adjustment. No single property in the body is
        required when updating. All properties not listed here will be ignored.
        Only metadata fields can be updated — amount and type cannot be changed.
      operationId: patchAdjustment
      security:
        - Bearer: [ ]
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of participant that owns the adjustment.
          schema:
            type: string
        - name: adjustmentId
          in: path
          required: true
          description: ID of adjustment.
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointUpdate'
        description: Adjustment properties to update.
        required: true
      responses:
        '202':
          description: Successful operation
        '404':
          description: Adjustment not found.
        default:
          description: Unknown exception
  /api/program/{programId}/participant/{uniqueId}/sso:
    post:
      tags:
        - Participant > SSO
      summary: Create a Single Sign On token for a participant.
      operationId: generateSSOToken
      security:
        - Bearer: [ ]
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: >-
            Unique ID of the participant for which you want to generate an SSO
            token.
          schema:
            type: string
        - name: lang
          in: query
          required: false
          description: Set the language for the participant logging into the marketplace.
          schema:
            $ref: '#/components/schemas/LanguageEnum'
        - name: country
          in: query
          required: false
          description: Set the country for the participant logging into the marketplace.
          schema:
            $ref: '#/components/schemas/CountryEnum'
        - name: redirect
          in: query
          required: false
          description: >-
            Set the redirect URL for the participant logging into the marketplace.
            The value must be a base64 encoded path. For example, to redirect a
            participant to the privacy policy (/content/privacy_policy), the query
            string would be ?redirect=L2NvbnRlbnQvcHJpdmFjeV9wb2xpY3k=
          schema:
            type: string
      responses:
        '201':
          description: SSO token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantSSO'
        '400':
          description: Resource does not exist or participant not active.
        default:
          description: Unknown exception
    get:
      tags:
        - Participant > SSO
      summary: Validate a participant SSO token
      description: Returns a participant object if the SSO token is valid.
      operationId: validateSSOToken
      security:
        - Bearer: [ ]
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of participant.
          schema:
            type: string
        - name: token
          in: query
          required: true
          description: SSO token to validate.
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantRead'
        '400':
          description: Resource does not exist or no token match.
  /api/program/{programId}/participant/{uniqueId}/meta:
    put:
      tags:
        - Participant
      summary: Replace all participant metadata.
      description: >-
        Completely replaces all existing participant metadata. Existing meta keys
        not present in the request body will be deleted.
      operationId: putParticipantMeta
      security:
        - Bearer: [ ]
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of participant.
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/MetaArray'
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid meta format or resource does not exist.
    patch:
      tags:
        - Participant
      summary: Add or Update one or more meta key pair values.
      description: >-
        Merges with existing metadata. Existing keys will be updated,
        new keys will be added. Keys not present in the request are left unchanged.
      operationId: patchParticipantMeta
      security:
        - Bearer: [ ]
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program unique_id.
          schema:
            type: string
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of participant.
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/MetaArray'
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid meta format or resource does not exist.
components:
  requestBodies:
    WebhookCreate:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookCreate'
      required: true
    MetaArray:
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Meta'
      description: Array of key-value meta objects.
      required: true
    UserWrite:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserWrite'
      description: Participant object.
      required: true
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    Bearer:
      description: >-
        For accessing the API, a valid JSON Web Token must be passed in all
        queries via the "Authorization" header. You may request a new JSON Web
        token at the following endpoint: /token, with the API User and Password
        credentials for the organization you are actioning.
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    JwtRequest:
      type: object
      description: >-
        Token generation parameters. These are passed as query parameters, not in
        the JSON body.
      properties:
        hoursUntilExpiry:
          type: integer
          description: Number of hours until the token expires.
          minimum: 1
          maximum: 8760
          default: 2
        tokenName:
          type: string
          description: Optional name for the token.
          maxLength: 255
    JwtResponse:
      type: object
      properties:
        token:
          type: string
          description: The JWT token string (HS256 encoded).
        expires:
          type: integer
          description: Unix timestamp when the token expires.
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    UserList:
      type: object
      description: >-
        Participant object as returned in list responses. Address, meta, and birthdate
        are excluded from list views to reduce payload size. PII fields may be excluded
        for users with limited access.
      properties:
        unique_id:
          type: string
          description: Participant unique identifier.
          minLength: 2
          maxLength: 45
        email_address:
          type: string
          description: Participant email address.
        credit:
          type: number
          description: Participant point balance.
        firstname:
          type: string
          description: Participant first name.
          maxLength: 50
        lastname:
          type: string
          description: Participant last name.
          maxLength: 50
        phone:
          type: string
          description: Participant phone number.
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        status:
          $ref: '#/components/schemas/UserStatusEnum'
        language:
          type: string
          description: Language preference.
          default: en
        transactions_disabled:
          type: integer
          description: Whether transactions are disabled for this participant. 0 = enabled, 1 = disabled.
          enum: [0, 1]
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type: string
          description: Last update timestamp (Y-m-d H:i:s).
        deactivated_at:
          type: string
          nullable: true
          description: Deactivation timestamp (Y-m-d H:i:s), null if active.
        program:
          type: string
          description: The assigned program unique_id.
        organization:
          type: string
          description: The assigned organization unique_id.
    UserWrite:
      type: object
      description: Participant create/update request body.
      properties:
        email_address:
          type: string
          description: >-
            Participant email address. Required on create. Must be a valid email format.
            Must be unique per program when email login is enabled.
        unique_id:
          type: string
          description: >-
            Participant unique identifier. Optional on create (auto-generated UUID if omitted).
            Cannot be changed on update. Alphanumeric with hyphens and underscores only.
          minLength: 2
          maxLength: 45
          pattern: '^[a-zA-Z0-9_-]+$'
        firstname:
          type: string
          description: Participant first name. No emojis allowed.
          maxLength: 50
        lastname:
          type: string
          description: Participant last name. No emojis allowed.
          maxLength: 50
        phone:
          type: string
          description: Participant phone number.
        birthdate:
          type: string
          description: Participant birthdate in YYYY-MM-DD format.
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '1990-01-15'
        password:
          type: string
          description: Participant password. If provided, password_confirm must also be provided and match.
        password_confirm:
          type: string
          description: Must match password if password is provided.
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
          default: 1
        status:
          $ref: '#/components/schemas/UserStatusEnum'
        language:
          type: string
          description: Language preference.
          default: en
        address:
          $ref: '#/components/schemas/Address'
        meta:
          type: array
          description: Array of key-value metadata pairs. On PUT, replaces all existing meta.
          items:
            $ref: '#/components/schemas/Meta'
    ParticipantRead:
      type: object
      description: >-
        Full participant object returned on single-resource GET, create, and update responses.
        Includes address and meta data. PII fields may be excluded for users with limited access.
      properties:
        unique_id:
          type: string
          description: Participant unique identifier.
        email_address:
          type: string
          description: Participant email address.
        credit:
          type: number
          description: Participant point balance.
        firstname:
          type: string
          description: Participant first name.
        lastname:
          type: string
          description: Participant last name.
        phone:
          type: string
          description: Participant phone number.
        birthdate:
          type: string
          description: Participant birthdate (YYYY-MM-DD).
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        status:
          $ref: '#/components/schemas/UserStatusEnum'
        language:
          type: string
          description: Language preference.
        transactions_disabled:
          type: integer
          description: Whether transactions are disabled. 0 = enabled, 1 = disabled.
          enum: [0, 1]
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type: string
          description: Last update timestamp (Y-m-d H:i:s).
        deactivated_at:
          type: string
          nullable: true
          description: Deactivation timestamp, null if active.
        address:
          $ref: '#/components/schemas/Address'
        program:
          type: string
          description: The assigned program unique_id.
        organization:
          type: string
          description: The assigned organization unique_id.
        meta:
          type: array
          items:
            $ref: '#/components/schemas/Meta'
    ParticipantSSO:
      type: object
      properties:
        token:
          type: string
          description: The SSO token.
        redirect:
          type: string
          description: The redirect URL, present if redirect parameter was provided.
    ProgramList:
      type: object
      description: Program object as returned in list responses.
      properties:
        unique_id:
          type: string
          description: Program unique identifier.
          maxLength: 45
        name:
          type: string
          description: The name of the program.
          maxLength: 125
        published:
          type: integer
          description: 1 is published, 0 is unpublished.
          enum: [0, 1]
        point:
          type: number
          description: The point-to-USD ratio. e.g. 1 means 1 point = $1 USD.
          minimum: 1
        url:
          type: string
          description: The full domain URL of the program (subdomain.domain).
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        is_avs:
          type: integer
          description: >-
            When 1, transactions created with shipping addresses will have
            their shipping addresses verified before creating the transaction.
          enum: [0, 1]
        enable_email_login:
          type: integer
          description: >-
            1 = enabled, 0 = disabled. When enabled, participants can
            login to the marketplace using their email address and password.
          enum: [0, 1]
          default: 0
        grace_period:
          type: integer
          nullable: true
          description: The number of days after end_date that the program remains active.
        timezone:
          type: string
          description: >-
            Program timezone. Options include: America/New_York, America/Chicago,
            America/Denver, America/Phoenix, America/Los_Angeles, America/Anchorage,
            America/Adak, Pacific/Honolulu.
          default: America/Phoenix
        start_date:
          type: string
          description: Program start date (YYYY-MM-DD).
        end_date:
          type: string
          description: Program end date (YYYY-MM-DD HH:MM:SS).
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type: string
          description: Last update timestamp (Y-m-d H:i:s).
        organization:
          type: string
          description: Organization unique_id.
        status:
          type: string
          description: Program status derived from active field.
        meta:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Meta'
    ProgramRead:
      type: object
      description: Full program object returned on single-resource GET, create, and update responses.
      properties:
        unique_id:
          type: string
          description: Program unique identifier.
          maxLength: 45
        name:
          type: string
          description: The name of the program.
          maxLength: 125
        published:
          type: integer
          description: 1 is published, 0 is unpublished.
          enum: [0, 1]
        collect_ssn:
          type: integer
          description: 1 is on, 0 is off.
          enum: [0, 1]
        is_avs:
          type: integer
          description: >-
            When 1, transactions created with shipping addresses will have
            their shipping addresses verified before creating the transaction.
            When 0, address verification does not occur on the transaction shipping address.
            Regardless of this setting, AVS is always enabled in the marketplace UI.
          enum: [0, 1]
        point:
          type: number
          description: The point-to-USD ratio. e.g. 1 means 1 point = $1 USD.
          minimum: 1
        url:
          type: string
          description: The full domain URL of the program (subdomain.domain).
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        enable_email_login:
          type: integer
          description: >-
            1 = enabled, 0 = disabled. When enabled, participants can
            login to the marketplace using their email address and password.
          enum: [0, 1]
          default: 0
        grace_period:
          type: integer
          nullable: true
          description: The number of days after end_date that the program remains active.
        timezone:
          type: string
          description: >-
            Program timezone. Options include: America/New_York, America/Chicago,
            America/Denver, America/Phoenix, America/Los_Angeles, America/Anchorage,
            America/Adak, Pacific/Honolulu.
          default: America/Phoenix
        start_date:
          type: string
          description: Program start date (YYYY-MM-DD).
        end_date:
          type: string
          description: Program end date (YYYY-MM-DD HH:MM:SS).
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type: string
          description: Last update timestamp (Y-m-d H:i:s).
        organization:
          type: object
          description: The parent organization.
          properties:
            unique_id:
              type: string
            name:
              type: string
            id:
              type: integer
        meta:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Meta'
        cost_center_id:
          type: string
          description: Cost center identifier.
          maxLength: 45
        accounting_id:
          type: string
          nullable: true
          description: Accounting identifier. Only superadmin/accounting roles can set this.
          maxLength: 45
        deposit_amount:
          type: integer
          description: Deposit amount.
          default: 0
        low_level_deposit:
          type: integer
          description: Low level deposit threshold.
          default: 0
        issue_1099:
          type: integer
          description: 1 is true, 0 is false.
          enum: [0, 1]
        employee_payroll_file:
          type: integer
          description: 1 is true, 0 is false.
          enum: [0, 1]
        contact:
          $ref: '#/components/schemas/Contact'
        accounting_contact:
          $ref: '#/components/schemas/Contact'
        productCriteria:
          $ref: '#/components/schemas/ProductCriteria'
        featured_products:
          type: array
          items:
            $ref: '#/components/schemas/ProductSku'
        auto_redemption:
          $ref: '#/components/schemas/AutoRedemption'
        one_time_auto_redemptions:
          type: array
          items:
            $ref: '#/components/schemas/OneTimeAutoRedemption'
        programTypes:
          type: array
          items:
            $ref: '#/components/schemas/ProgramType'
        actions:
          $ref: '#/components/schemas/Actions'
    ProgramCreate:
      type: object
      required:
        - unique_id
        - name
        - point
        - organization
      properties:
        unique_id:
          type: string
          description: >-
            Program unique identifier. Alphanumeric with hyphens and underscores only.
            No whitespace allowed.
          minLength: 1
          maxLength: 45
          pattern: '^[a-zA-Z0-9_-]+$'
        name:
          type: string
          description: The name of the program.
          minLength: 1
          maxLength: 125
        point:
          type: number
          description: The point-to-USD ratio. e.g. 1 means 1 point = $1 USD.
          minimum: 1
        organization:
          type: string
          description: Organization unique_id to assign this program to.
        url:
          type: string
          description: Full domain URL (subdomain.domain format).
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
          default: 1
        published:
          type: integer
          description: 1 is published, 0 is unpublished.
          enum: [0, 1]
        start_date:
          type: string
          description: Program start date (YYYY-MM-DD).
        end_date:
          type: string
          description: Program end date (YYYY-MM-DD HH:MM:SS).
        grace_period:
          type: integer
          description: The number of days after end_date that the program remains active.
        enable_email_login:
          type: integer
          description: >-
            0 = Disabled, 1 = enabled. When enabled, participants can
            login to the marketplace using their email address and password.
          enum: [0, 1]
          default: 0
        timezone:
          type: string
          description: >-
            Program timezone. Must be a valid timezone ID. Options include:
            America/New_York, America/Chicago, America/Denver, America/Phoenix,
            America/Los_Angeles, America/Anchorage, America/Adak, Pacific/Honolulu.
          default: America/Phoenix
        collect_ssn:
          type: integer
          description: 1 to collect SSN, 0 to not.
          enum: [0, 1]
        is_avs:
          type: integer
          description: 1 to enable address verification on transactions, 0 to disable.
          enum: [0, 1]
          default: 0
        deposit_amount:
          type: number
          description: Deposit amount.
        low_level_deposit:
          type: number
          description: Low level deposit threshold.
        issue_1099:
          type: integer
          description: 1 is true, 0 is false.
          enum: [0, 1]
        employee_payroll_file:
          type: integer
          description: 1 is true, 0 is false.
          enum: [0, 1]
        cost_center_id:
          type: string
          description: Cost center identifier.
          maxLength: 45
        accounting_id:
          type: string
          nullable: true
          description: Accounting identifier. Only superadmin/accounting roles can set this.
          maxLength: 45
        contact:
          $ref: '#/components/schemas/ContactWrite'
        accounting_contact:
          $ref: '#/components/schemas/ContactWrite'
        auto_redemption:
          type: object
          description: Auto-redemption settings. product_sku is required if this object is provided.
          properties:
            product_sku:
              type: string
              description: SKU of the product for auto-redemption.
            active:
              type: integer
              enum: [0, 1]
            all_participant:
              type: integer
              enum: [0, 1]
        one_time_auto_redemptions:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
              active:
                type: integer
                enum: [0, 1]
              participant_count:
                type: integer
        programTypes:
          type: array
          description: Array of program type IDs.
          items:
            type: integer
    ProgramUpdate:
      type: object
      description: >-
        Program update request body. Only include fields you wish to change.
        unique_id cannot be changed. Setting active=0 also sets published=0.
      properties:
        name:
          type: string
          description: The name of the program.
          minLength: 1
          maxLength: 125
        point:
          type: number
          description: The point-to-USD ratio.
          minimum: 1
        url:
          type: string
          description: Full domain URL (subdomain.domain format).
        active:
          type: integer
          description: 1 for active, 0 for inactive. Setting to 0 also sets published to 0.
          enum: [0, 1]
        published:
          type: integer
          description: 1 is published, 0 is unpublished.
          enum: [0, 1]
        start_date:
          type: string
          description: Program start date (YYYY-MM-DD).
        end_date:
          type: string
          description: Program end date (YYYY-MM-DD HH:MM:SS).
        grace_period:
          type: integer
          description: Days after end_date that the program remains active.
        enable_email_login:
          type: integer
          description: 0 = Disabled, 1 = enabled.
          enum: [0, 1]
        timezone:
          type: string
          description: Program timezone. Must be a valid timezone ID.
        collect_ssn:
          type: integer
          enum: [0, 1]
        is_avs:
          type: integer
          enum: [0, 1]
        deposit_amount:
          type: number
        low_level_deposit:
          type: number
        issue_1099:
          type: integer
          enum: [0, 1]
        employee_payroll_file:
          type: integer
          enum: [0, 1]
        cost_center_id:
          type: string
          maxLength: 45
        accounting_id:
          type: string
          nullable: true
          description: Only superadmin/accounting roles can modify this.
          maxLength: 45
        contact:
          $ref: '#/components/schemas/ContactWrite'
        accounting_contact:
          $ref: '#/components/schemas/ContactWrite'
        auto_redemption:
          type: object
          properties:
            product_sku:
              type: string
            active:
              type: integer
              enum: [0, 1]
            all_participant:
              type: integer
              enum: [0, 1]
        one_time_auto_redemptions:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
              active:
                type: integer
                enum: [0, 1]
              participant_count:
                type: integer
        programTypes:
          type: array
          items:
            type: integer
    ProgramMetrics:
      description: Basic program metrics.
      type: object
      properties:
        participant_total:
          description: Total number of active participants.
          type: integer
        transaction_total:
          description: Total number of transactions.
          type: integer
        adjustment_total:
          description: Total number of point adjustments.
          type: integer
    OrganizationList:
      type: object
      description: Organization object as returned in list responses.
      properties:
        unique_id:
          type: string
          description: The unique identifier of the organization.
          minLength: 2
          maxLength: 45
          pattern: '^[a-zA-Z0-9_-]+$'
        name:
          type: string
          description: The name of the organization.
          minLength: 2
          maxLength: 50
        industry_program:
          $ref: '#/components/schemas/IndustryProgramEnum'
        program_count:
          description: The number of programs configured under this organization.
          type: integer
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        parent:
          type: string
          nullable: true
          description: Parent organization unique_id.
        domains:
          type: array
          description: Domain URLs associated with this organization.
          items:
            type: string
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type: string
          description: Last update timestamp (Y-m-d H:i:s).
    OrganizationRead:
      type: object
      description: Full organization object.
      properties:
        unique_id:
          type: string
          description: The unique identifier of the organization.
          minLength: 2
          maxLength: 45
        parent:
          type: string
          nullable: true
          description: The parent organization unique_id.
        name:
          type: string
          description: The name of the organization.
          minLength: 2
          maxLength: 50
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type: string
          description: Last update timestamp (Y-m-d H:i:s).
        domains:
          type: array
          description: >-
            Domain URLs associated with this organization. Each domain must match
            the pattern for a valid domain URL and be unique across all organizations.
          items:
            type: string
        industry_program:
          $ref: '#/components/schemas/IndustryProgramEnum'
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        program_count:
          type: integer
          description: The number of programs configured under this organization.
        company_contact:
          $ref: '#/components/schemas/Contact'
        accounts_payable_contact:
          $ref: '#/components/schemas/Contact'
    OrganizationCreate:
      type: object
      required:
        - unique_id
        - name
        - parent
      properties:
        unique_id:
          type: string
          description: >-
            The unique identifier for the organization. Alphanumeric with hyphens
            and underscores only.
          minLength: 2
          maxLength: 45
          pattern: '^[a-zA-Z0-9_-]+$'
        parent:
          type: string
          description: >-
            The parent organization unique_id. Required. Must reference an existing
            organization. Cannot create circular references.
        name:
          type: string
          description: The name of the organization.
          minLength: 2
          maxLength: 50
        domains:
          type: array
          description: >-
            Domain URLs to associate with this organization. Each must be a valid
            domain URL and unique across all organizations. Converted to lowercase.
          items:
            type: string
        industry_program:
          $ref: '#/components/schemas/IndustryProgramEnum'
        company_contact:
          $ref: '#/components/schemas/ContactWrite'
        accounts_payable_contact:
          $ref: '#/components/schemas/ContactWrite'
    OrganizationUpdate:
      type: object
      description: >-
        Organization update request body. Only include fields you wish to change.
        unique_id and parent cannot be changed on update (they will be silently ignored).
      properties:
        name:
          type: string
          description: The name of the organization.
          minLength: 1
          maxLength: 50
        domains:
          type: array
          description: >-
            Replaces all existing domains. Each must be a valid domain URL and
            unique across all organizations.
          items:
            type: string
        industry_program:
          description: >-
            Industry program type. Can only be set once; cannot be unset after initial assignment.
          $ref: '#/components/schemas/IndustryProgramEnum'
        company_contact:
          $ref: '#/components/schemas/ContactWrite'
        accounts_payable_contact:
          $ref: '#/components/schemas/ContactWrite'
    WebhookCreate:
      type: object
      required:
        - title
        - url
        - event
      properties:
        title:
          type: string
          description: Webhook title.
          minLength: 1
          maxLength: 255
        url:
          type: string
          description: >-
            URL the webhook POSTs data to. Must start with https:// and be between
            11 and 255 characters. Cannot point to private/reserved IP addresses.
          minLength: 11
          maxLength: 255
        event:
          type: string
          description: Which event triggers this webhook (e.g. Transaction.create).
          minLength: 1
          maxLength: 255
        auth_type:
          type: string
          nullable: true
          description: Authentication type for the webhook endpoint.
          enum:
            - Bearer
            - Basic
        username:
          type: string
          nullable: true
          description: Username for basic authentication.
        password:
          type: string
          nullable: true
          description: Password for basic authentication.
        active:
          type: integer
          description: Is this webhook active? 0 = false, 1 = true.
          enum: [0, 1]
        immutable:
          type: integer
          description: Can this webhook be modified? 0 = mutable, 1 = immutable.
          enum: [0, 1]
    WebhookRead:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier of the webhook.
        title:
          type: string
          description: Webhook title.
        url:
          type: string
          description: URL the webhook POSTs data to.
        event:
          type: string
          description: Which event triggers this webhook.
        auth_type:
          type: string
          nullable: true
          description: Authentication type (Bearer or Basic).
        active:
          type: integer
          description: Is this webhook active? 0 = false, 1 = true.
          enum: [0, 1]
        immutable:
          type: integer
          description: Can this webhook be modified? 0 = mutable, 1 = immutable.
          enum: [0, 1]
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
    WebhookLogs:
      type: object
      properties:
        webhookLogs:
          type: array
          items:
            $ref: '#/components/schemas/WebhookLog'
    WebhookLog:
      type: object
      properties:
        _id:
          type: object
          properties:
            $oid:
              type: string
              description: MongoDB ObjectId.
        request_time:
          type: object
        http_status:
          type: integer
          description: >-
            Most recent HTTP status response from the webhook's last attempt.
        responses:
          type: array
          items:
            $ref: '#/components/schemas/httpResponse'
        request:
          $ref: '#/components/schemas/httpRequest'
    WebhookReplayResponse:
      type: object
      properties:
        http_status_code:
          description: >-
            The HTTP response status code from the server the webhook was replayed to,
            or the string "Failed" if the connection failed.
          oneOf:
            - type: integer
            - type: string
              enum: ["Failed"]
    httpRequest:
      type: object
      properties:
        headers:
          type: object
          description: Request headers (Authorization header is stripped).
        body:
          type: string
    httpResponse:
      allOf:
        - $ref: '#/components/schemas/httpRequest'
        - type: object
          properties:
            http_status:
              type: integer
    CreateTransaction:
      type: object
      required:
        - products
      properties:
        products:
          type: array
          description: Array of products for the transaction. At least one product is required.
          items:
            $ref: '#/components/schemas/ProductForTransaction'
        issue_points:
          type: boolean
          description: >-
            When true, credits the participant with enough points to cover the
            transaction cost before processing. Defaults to false.
          default: false
        shipping:
          $ref: '#/components/schemas/Address'
        email_address:
          type: string
          description: >-
            Email address for the transaction. Must be a valid email.
            Required for digital products if participant has no email on file.
        phone:
          type: string
          description: Phone number for the transaction. Must be a valid phone number if provided.
        unique_id:
          type: string
          description: Optional transaction unique identifier.
        transaction_source:
          type: string
          description: >-
            Transaction source identifier. Reserved values (AUTO_REDEMPTION,
            MARKETPLACE, CUSTOMER_SERVICE, GAMES, KIA_KASH, REDEMPTION_CAMPAIGNS,
            SWEEPSTAKE) cannot be used unless the caller is a superadmin.
        avs_disabled:
          type: boolean
          description: >-
            When true, disables Address Verification Service for this transaction
            even if the program has AVS enabled. Defaults to false.
          default: false
        meta:
          type: array
          items:
            $ref: '#/components/schemas/Meta'
    Transaction:
      type: object
      properties:
        id:
          type: integer
        unique_id:
          type: string
        participant_id:
          type: integer
        wholesale:
          type: number
          format: float
        subtotal:
          type: number
          format: float
        total:
          type: number
          format: float
        points:
          type: number
          format: float
          description: Total points cost (total * program point ratio).
        email_address:
          type: string
        phone:
          type: string
        type:
          type: integer
          description: Transaction type.
        status:
          type: string
          description: Transaction status.
        created_at:
          type: string
        updated_at:
          type: string
        shipping:
          $ref: '#/components/schemas/TransactionAddressRead'
        meta:
          type: array
          items:
            $ref: '#/components/schemas/Meta'
        products:
          type: array
          items:
            $ref: '#/components/schemas/TransactionProductRead'
        user:
          $ref: '#/components/schemas/ParticipantRead'
    TransactionProductRead:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        quantity:
          type: integer
        total:
          type: number
          format: float
        points:
          type: number
          format: float
        guid:
          type: string
          description: Unique GUID for this transaction item.
        reissue_date:
          type: string
          description: Reissue date (YYYY-MM-DD).
        returned:
          type: integer
          description: 1 if item has been returned, 0 if not.
          enum: [0, 1]
        var_amount:
          type: number
          format: float
          description: Variable amount for ranged-price products.
        program_fee:
          type: number
          format: float
        terms_approved:
          type: string
        is_digital:
          type: integer
          description: 1 for digital, 0 for physical.
          enum: [0, 1]
        is_wallet_enabled:
          type: integer
          description: 1 if wallet enabled, 0 if not.
          enum: [0, 1]
    ProductForTransaction:
      type: object
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
          description: Product SKU (converted to uppercase).
        quantity:
          type: integer
          description: Quantity to order. Must be greater than 0.
          minimum: 1
        amount:
          type: number
          description: >-
            Required for ranged-price products. The dollar amount to apply.
            Must be within the product's min/max price range.
    ParticipantIdArray:
      type: object
      required:
        - participant_id
      properties:
        participant_id:
          type: array
          description: Array of participant unique IDs to fetch.
          items:
            type: string
          example:
            - UNIQUE_ID1
            - UNIQUE_ID2
            - UNIQUE_ID3
    Meta:
      type: object
      description: A single key-value metadata pair. The key is the property name and the value is its value.
      additionalProperties:
        type: string
      example:
        department: "Engineering"
    ProductSku:
      type: string
    Address:
      type: object
      properties:
        firstname:
          type: string
          description: Recipient first name. Required for physical product shipments.
        lastname:
          type: string
          description: Recipient last name.
        address1:
          type: string
          description: Street address line 1.
        address2:
          type: string
          description: Street address line 2.
        city:
          type: string
          description: City.
        state:
          type: string
          description: State abbreviation (e.g. NY). Required for US shipments with physical items.
        zip:
          type: string
          description: Postal/ZIP code.
        country_code:
          type: string
          description: Two-letter country code (e.g. US, CA).
          maxLength: 2
          default: US
    TransactionAddressRead:
      type: object
      properties:
        firstname:
          type: string
        lastname:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
          description: Country name or code.
        country_code:
          type: string
          description: Two-letter country code.
    PointRead:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: number
          description: >-
            Point amount (displayed as amount * program point ratio).
        type:
          type: string
          description: '"credit" to add points, "debit" to subtract points.'
          enum:
            - credit
            - debit
        reference:
          type: string
          description: Reference identifier for client internal use.
        description:
          type: string
          description: Description visible to the participant.
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type: string
          description: Last update timestamp (Y-m-d H:i:s).
        transaction_id:
          type: integer
          nullable: true
          description: Associated transaction ID, null for manual adjustments.
        transaction_item_id:
          type: integer
          nullable: true
        completed_at:
          type: string
          nullable: true
          description: Date the activity was completed (YYYY-MM-DD).
        activity:
          type: string
          nullable: true
          description: Activity label for the adjustment.
        status:
          type: string
          description: Adjustment status.
    PointReadWithUser:
      allOf:
        - $ref: '#/components/schemas/PointRead'
        - type: object
          properties:
            user:
              $ref: '#/components/schemas/ParticipantRead'
    PointWrite:
      type: object
      required:
        - amount
        - type
      properties:
        amount:
          type: number
          description: >-
            Point amount. Must be positive and non-empty. Credit adjustments
            cannot cause the total to exceed 99999999.99.
          minimum: 0
          exclusiveMinimum: true
        type:
          type: string
          description: '"credit" to add points, "debit" to subtract points.'
          enum:
            - credit
            - debit
        reference:
          type: string
          description: Reference identifier for client use.
        completed_at:
          type: string
          description: >-
            YYYY-MM-DD. Optional reference to the date a participant completed
            the activity to receive the points. This can be used if the date
            the points are credited via the API is after the date the
            participant earned the points.
        description:
          type: string
          description: Description visible to participant.
        activity:
          type: string
          description: Activity label for the adjustment.
    PointUpdate:
      type: object
      description: >-
        Update adjustment metadata. Amount and type cannot be changed after creation.
      properties:
        reference:
          type: string
          description: Reference identifier for client use.
        completed_at:
          type: string
          description: >-
            YYYY-MM-DD. Optional reference to the date a participant completed
            the activity to receive the points.
        description:
          type: string
          description: Description visible to participant.
        activity:
          type: string
          description: Activity label for the adjustment.
    ReturnRead:
      type: object
      properties:
        id:
          type: integer
        guid:
          type: string
          description: Return GUID.
        notes:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        user:
          $ref: '#/components/schemas/ReturnUserRead'
        item:
          $ref: '#/components/schemas/ReturnItemRead'
        participant:
          $ref: '#/components/schemas/ParticipantRead'
    ReturnUserRead:
      type: object
      description: The admin user who processed the return.
      properties:
        id:
          type: integer
        email:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    ReturnItemRead:
      type: object
      properties:
        transaction_id:
          type: integer
          description: The transaction ID of the item returned.
        sku:
          type: string
        guid:
          type: string
          description: The GUID of the transaction item.
        quantity:
          type: integer
          description: The quantity of item returned.
    UserStatusEnum:
      type: string
      description: >-
        Acceptable participant statuses: ACTIVE, HOLD (still active),
