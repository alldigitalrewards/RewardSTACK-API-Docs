          type:
            - "string"
            - "null"
          description: Time of day to issue the award (HH:mm, 24-hour format).
          example: "09:00"
        timezone:
          type:
            - "string"
            - "null"
          description: Timezone for the issuance time (e.g. America/New_York).
        active:
          type: integer
          description: 1 is true 0 is false
        issuance_email_enabled:
          type: integer
          description: >-
            1 is true 0 is false. When enabled, participants receive an email
            when they are enrolled in the award.
        issuance_email_template:
          type: string
          description: HTML email template sent when a participant is enrolled.
        fulfillment_email_template:
          type:
            - "string"
            - "null"
          description: HTML email template sent when a reward is fulfilled.
        sent_from:
          type:
            - "string"
            - "null"
          description: Email address used as the sender for award notifications.
        issuance_subject:
          type:
            - "string"
            - "null"
          description: Subject line for issuance notification emails.
        fulfillment_subject:
          type:
            - "string"
            - "null"
          description: Subject line for fulfillment notification emails.
        created_at:
          type: string
          description: Datetime the award was created.
        updated_at:
          type: string
          description: Datetime the award was last updated.
