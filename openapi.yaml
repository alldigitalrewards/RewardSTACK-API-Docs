        Industry program types: 1 = Health_Wellness, 2 = Channel_Sales,
        3 = Employee_Recognition, 4 = Consumer, 5 = Market_Research,
        6 = Loyalty_Marketing, 7 = Rebates.
      enum: [1, 2, 3, 4, 5, 6, 7]
    LanguageEnum:
      type: string
      enum:
        - en_US
        - es_US
      description: 'Language options: en_US = English, es_US = Spanish.'
    CountryEnum:
      type: string
      description: Supported country codes.
      enum:
        - US
        - CA
        - MX
        - ES
        - DE
        - IN
        - JP
        - KR
        - IT
        - MY
        - NL
        - BR
        - RU
        - CN
    Contact:
      type: object
      description: Contact information (read response).
      properties:
        firstname:
          type: string
        lastname:
          type: string
        phone:
          type: string
        email:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        state:
          type: string
          description: State abbreviation (e.g. NY).
        zip:
          type: string
    ContactWrite:
