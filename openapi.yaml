        service award, including their milestone date and fulfillment history.
      parameters:
        - name: programId
          in: path
          required: true
          description: The unique identifier of the program.
          schema:
            type: string
            format: uuid
        - name: serviceAwardId
          in: path
          required: true
          description: The unique identifier of the service award.
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: Request a specific page number starting with page 1.
