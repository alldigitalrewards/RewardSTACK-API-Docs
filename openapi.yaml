        DATADEL (sets inactive and deletes user PII - can only be set via DELETE endpoint).
      enum:
        - ACTIVE
        - HOLD
        - INACTIVE
        - CANCELLED
        - SUSPENDED
    IndustryProgramEnum:
      type: integer
