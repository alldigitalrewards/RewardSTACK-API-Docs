          required: true
          description: The Milestone Unique Identifier.
          schema:
            type: string
            format: uuid
        - name: participantId
          in: path
          required: true
          description: The Participant Unique Identifier.
          schema:
            type: string
        - name: activityId
          in: path
          required: true
          description: The Activity Unique Identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCompletionUpdate'
        description: Completion status update.
        required: true
      responses:
        '200':
          description: Activity completion status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityCompletionResponse'
        '404':
          description: Participant progress or activity not found.
        default:
          description: Unknown exception

  /api/batch/participant:
    post:
      tags:
        - Batch
      summary: Create many participants at once
      operationId: batchParticipant
      security:
        - Bearer: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchParticipant'
        description: Collection of participant objects to add to the marketplace.
        required: true
      responses:
        '201':
          description: successful operation
        default:
          description: Unknown exception
  /api/batch/adjustment:
    post:
      tags:
        - Batch
      summary: Create many points adjustments at once
      operationId: batchAdjustent
      security:
        - Bearer: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAdjustment'
        description: Collection of adjustment objects to add to the marketplace.
        required: true
      responses:
        '201':
          description: successful operation
        default:
          description: Unknown exception
  /api/batch/transaction:
    post:
      tags:
        - Batch
      summary: Create many transactions at once
      operationId: batchTransaction
      security:
        - Bearer: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchTransaction'
        description: Collection of transaction objects to add to the marketplace.
        required: true
      responses:
        '201':
          description: successful operation
        default:
          description: Unknown exception

components:
  requestBodies:
    WebhookCreate:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookCreate'
      required: true
    MetaArray:
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Meta'
      description: Array of key-value meta objects.
      required: true
    UserWrite:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserWrite'
      description: Participant object.
      required: true
  responses:
    Forbidden:
      description: >-
        The token's user cannot access the organization or program in the URL.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Forbidden
    InternalError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalErrorResponse'
          example:
            status: error
            message: Internal server error
    ServiceAwardUnauthorized:
      description: Missing, invalid, or expired bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalErrorResponse'
          example:
            status: error
            message: Token not found.
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    Bearer:
      description: >-
        For accessing the API, a valid JSON Web Token must be passed in all
        queries via the "Authorization" header. You may request a new JSON Web
        token at the following endpoint: /token, with the API User and Password
        credentials for the organization you are actioning.
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    JwtRequest:
      type: object
      description: >-
        Token generation parameters. Send them as query parameters or in a JSON
        body.
      properties:
        hoursUntilExpiry:
          type: integer
          description: Number of hours until the token expires.
          minimum: 1
          maximum: 8760
          default: 2
        tokenName:
          type: string
          description: Optional name for the token.
          maxLength: 255
    JwtResponse:
      type: object
      properties:
        token:
          type: string
          description: The JWT token string (HS256 encoded).
        expires:
          type: integer
          description: Unix timestamp when the token expires.
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    MessageErrorsResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: string
    InternalErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
    TokenReference:
      type: object
      description: A generated token. The token value itself is never returned.
      properties:
        jti:
          type: string
          description: The token id. Use it to revoke the token.
        createdAt:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        expiresAt:
          type: string
          description: Expiry timestamp (Y-m-d H:i:s).
        invalidatedAt:
          type:
            - "string"
            - "null"
          description: When the token was revoked (Y-m-d H:i:s), or null.
        usageCount:
          type: integer
          description: How many requests used this token.
        userId:
          type: integer
          description: The id of the user the token belongs to.
        tokenName:
          type:
            - "string"
            - "null"
          description: The name given when the token was generated.
        emailAddress:
          type: string
          description: The email address of the user the token belongs to.
    TokenReferenceList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TokenReference'
        page:
          type: integer
          description: The current page.
        pageSize:
          type: integer
          description: Tokens per page (30).
        totalCount:
          type: integer
          description: Total number of tokens.
        totalPageCount:
          type: integer
          description: Total number of pages.
      example:
        data:
          - jti: 3f6c1d2e-8a4b-4c7d-9e1f-2a3b4c5d6e7f
            createdAt: '2026-01-15 14:05:00'
            expiresAt: '2026-01-15 16:05:00'
            invalidatedAt: null
            usageCount: 12
            userId: 42
            tokenName: null
            emailAddress: api-user@example.com
        page: 1
        pageSize: 30
        totalCount: 1
        totalPageCount: 1
    UserList:
      type: object
      description: >-
        Participant object as returned in list responses. Address, meta, and birthdate
        are excluded from list views to reduce payload size. PII fields may be excluded
        for users with limited access.
      properties:
        unique_id:
          type: string
          description: Participant unique identifier.
          minLength: 2
          maxLength: 45
        email_address:
          type: string
          description: Participant email address.
        credit:
          type: string
          description: >-
            The participant's earned (non-shareable) point balance. Returned
            as a quoted decimal string (for example "0.00"), not a JSON number.
        shared_credit:
          type: string
          description: >-
            The participant's shareable point balance. Returned as a quoted
            decimal string (for example "0.00"), not a JSON number.
        firstname:
          type: string
          description: Participant first name.
          maxLength: 50
        lastname:
          type: string
          description: Participant last name.
          maxLength: 50
        phone:
          type:
            - "string"
            - "null"
          description: Participant phone number.
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        status:
          $ref: '#/components/schemas/UserStatusEnum'
        language:
          type:
            - "string"
            - "null"
          description: Language preference.
          default: en
        transactions_disabled:
          type: boolean
          description: Whether transactions are disabled for this participant.
        id_verified:
          type:
            - "integer"
            - "null"
          description: Identity verification result. Null when not yet reviewed.
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type:
            - "string"
            - "null"
          description: Last update timestamp (Y-m-d H:i:s), null if never updated.
        deactivated_at:
          type:
            - "string"
            - "null"
          description: Deactivation timestamp (Y-m-d H:i:s), null if active.
        program:
          type: string
          description: The assigned program unique_id.
        organization:
          type: string
          description: The assigned organization unique_id.
    UserWrite:
      type: object
      description: Participant create/update request body.
      properties:
        email_address:
          type: string
          description: >-
            Participant email address. Required on create. Must be a valid email format.
            Must be unique per program when email login is enabled.
        program:
          type: string
          description: >-
            The program unique_id the participant belongs to. Required on create.
        unique_id:
          type: string
          description: >-
            Participant unique identifier. Optional on create (auto-generated UUID if omitted).
            Cannot be changed on update. Alphanumeric with hyphens and underscores only.
          minLength: 2
          maxLength: 45
          pattern: '^[a-zA-Z0-9_-]+$'
        firstname:
          type: string
          description: Participant first name. No emojis allowed.
          maxLength: 50
        lastname:
          type: string
          description: Participant last name. No emojis allowed.
          maxLength: 50
        phone:
          type: string
          description: Participant phone number.
        birthdate:
          type: string
          description: Participant birthdate in YYYY-MM-DD format.
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '1990-01-15'
        password:
          type: string
          description: Participant password. If provided, password_confirm must also be provided and match.
        password_confirm:
          type: string
          description: Must match password if password is provided.
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
          default: 1
        status:
          $ref: '#/components/schemas/UserStatusEnum'
        language:
          type: string
          description: Language preference.
          default: en
        address:
          $ref: '#/components/schemas/Address'
        meta:
          type: array
          description: Array of key-value metadata pairs. On PUT, replaces all existing meta.
          items:
            $ref: '#/components/schemas/Meta'
    ParticipantRead:
      type: object
      description: >-
        Full participant object returned on single-resource GET, create, and update responses.
        Includes address and meta data. PII fields may be excluded for users with limited access.
      properties:
        unique_id:
          type: string
          description: Participant unique identifier.
        email_address:
          type: string
          description: Participant email address.
        credit:
          type: string
          description: >-
            The participant's earned (non-shareable) point balance. Returned
            as a quoted decimal string (for example "0.00"), not a JSON number.
        shared_credit:
          type: string
          description: >-
            The participant's shareable point balance. These points can be
            shared with other participants in the same program when point
            sharing is enabled. Returned as a quoted decimal string (for
            example "0.00"), not a JSON number.
        firstname:
          type: string
          description: Participant first name.
        lastname:
          type: string
          description: Participant last name.
        phone:
          type:
            - "string"
            - "null"
          description: Participant phone number.
        birthdate:
          type:
            - "string"
            - "null"
          description: Participant birthdate (YYYY-MM-DD).
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        status:
          $ref: '#/components/schemas/UserStatusEnum'
        language:
          type: string
          description: Language preference.
        transactions_disabled:
          type: boolean
          description: Whether transactions are disabled.
        id_verified:
          type:
            - "integer"
            - "null"
          description: Identity verification result. Null when not yet reviewed.
        password_updated_at:
          type:
            - "string"
            - "null"
          description: Timestamp the password was last changed (Y-m-d H:i:s), null if never set.
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type:
            - "string"
            - "null"
          description: Last update timestamp (Y-m-d H:i:s), null if never updated.
        deactivated_at:
          type:
            - "string"
            - "null"
          description: Deactivation timestamp, null if active.
        address:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
          description: Null when no address has been set.
        program:
          type: string
          description: The assigned program unique_id.
        organization:
          type: string
          description: The assigned organization unique_id.
        meta:
          type: array
          items:
            $ref: '#/components/schemas/Meta'
        share_usage:
          type: object
          description: Present only when the participant's program has point sharing enabled.
          properties:
            daily_shared:
              type: number
              description: Amount shared by this participant so far today.
            weekly_shared:
              type: number
              description: Amount shared by this participant so far this week.
            monthly_shared:
              type: number
              description: Amount shared by this participant so far this month.
            total_shared:
              type: number
              description: Lifetime amount shared by this participant.
    ParticipantSSO:
      type: object
      description: >-
        Returned on successful SSO token generation. There is no `redirect`
        field: a decoded `redirect` query parameter is appended as part of the
        `exchange` URL instead.
      properties:
        token:
          type: string
          description: The SSO token.
        participant:
          type: string
          description: The participant's unique_id.
        domain:
          type: string
          description: The bare marketplace domain (for example mydigitalrewards.com).
        exchange:
          type: string
          description: >-
            The full marketplace URL to redirect the participant's browser to,
            including the authenticate token and, if a redirect parameter was
            provided, the decoded redirect path.
    ProgramList:
      type: object
      description: Program object as returned in list responses.
      properties:
        unique_id:
          type: string
          description: Program unique identifier.
          maxLength: 45
        name:
          type: string
          description: The name of the program.
          maxLength: 125
        published:
          type: integer
          description: 1 is published, 0 is unpublished.
          enum: [0, 1]
        point:
          type: number
          description: The point-to-USD ratio. e.g. 1 means 1 point = $1 USD.
          minimum: 1
        url:
          type: string
          description: The full domain URL of the program (subdomain.domain).
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        is_avs:
          type: integer
          description: >-
            When 1, transactions created with shipping addresses will have
            their shipping addresses verified before creating the transaction.
          enum: [0, 1]
        enable_email_login:
          type: integer
          description: >-
            1 = enabled, 0 = disabled. When enabled, participants can
            login to the marketplace using their email address and password.
          enum: [0, 1]
          default: 0
        grace_period:
          type:
            - "integer"
            - "null"
          description: The number of days after end_date that the program remains active.
        timezone:
          type: string
          description: >-
            Program timezone. Options include: America/New_York, America/Chicago,
            America/Denver, America/Phoenix, America/Los_Angeles, America/Anchorage,
            America/Adak, Pacific/Honolulu.
          default: America/Phoenix
        start_date:
          type:
            - "string"
            - "null"
          description: Program start date (YYYY-MM-DD).
        end_date:
          type:
            - "string"
            - "null"
          description: Program end date (YYYY-MM-DD HH:MM:SS).
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type: string
          description: Last update timestamp (Y-m-d H:i:s).
        organization:
          type: string
          description: Organization unique_id.
        meta:
          type:
            - "array"
            - "null"
          items:
            $ref: '#/components/schemas/Meta'
    ProgramRead:
      type: object
      description: Full program object returned on single-resource GET, create, and update responses.
      properties:
        unique_id:
          type: string
          description: Program unique identifier.
          maxLength: 45
        name:
          type: string
          description: The name of the program.
          maxLength: 125
        published:
          type: integer
          description: 1 is published, 0 is unpublished.
          enum: [0, 1]
        collect_ssn:
          type: integer
          description: 1 is on, 0 is off.
          enum: [0, 1]
        is_avs:
          type: integer
          description: >-
            When 1, transactions created with shipping addresses will have
            their shipping addresses verified before creating the transaction.
            When 0, address verification does not occur on the transaction shipping address.
            Regardless of this setting, AVS is always enabled in the marketplace UI.
          enum: [0, 1]
        point:
          type: number
          description: The point-to-USD ratio. e.g. 1 means 1 point = $1 USD.
          minimum: 1
        url:
          type:
            - "string"
            - "null"
          description: >-
            The full domain URL of the program (subdomain.domain). Null until
            a domain has been assigned.
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        point_sharing:
          type: integer
          description: >-
            1 enables point sharing between participants, 0 disables it.
            When enabled, participants can share their shareable points with
            other participants in the same program.
          enum: [0, 1]
        has_shareable_points:
          type: boolean
          description: >-
            Indicates whether the program has any shareable adjustments.
            When true, point_sharing cannot be disabled.
        share_link_label:
          type:
            - "string"
            - "null"
          description: Custom label for the participant-facing share link.
        share_total_max:
          type:
            - "number"
            - "null"
          description: >-
            Lifetime maximum a participant may share in this program. Null
            means no limit.
        share_per_transaction_max:
          type:
            - "number"
            - "null"
          description: >-
            Maximum amount a participant may share in a single transaction.
            Null means no limit.
        share_daily_max:
          type:
            - "number"
            - "null"
          description: >-
            Maximum amount a participant may share per day. Null means no
            limit.
        share_weekly_max:
          type:
            - "number"
            - "null"
          description: >-
            Maximum amount a participant may share per week. Null means no
            limit.
        share_monthly_max:
          type:
            - "number"
            - "null"
          description: >-
            Maximum amount a participant may share per month. Null means no
            limit.
        enable_email_login:
          type: integer
          description: >-
            1 = enabled, 0 = disabled. When enabled, participants can
            login to the marketplace using their email address and password.
          enum: [0, 1]
          default: 0
        grace_period:
          type:
            - "integer"
            - "null"
          description: The number of days after end_date that the program remains active.
        timezone:
          type: string
          description: >-
            Program timezone. Options include: America/New_York, America/Chicago,
            America/Denver, America/Phoenix, America/Los_Angeles, America/Anchorage,
            America/Adak, Pacific/Honolulu.
          default: America/Phoenix
        start_date:
          type:
            - "string"
            - "null"
          description: Program start date (YYYY-MM-DD).
        end_date:
          type:
            - "string"
            - "null"
          description: Program end date (YYYY-MM-DD HH:MM:SS).
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type:
            - "string"
            - "null"
          description: Last update timestamp (Y-m-d H:i:s), null if never updated.
        organization:
          type: string
          description: The parent organization's unique_id.
        meta:
          type:
            - "array"
            - "null"
          items:
            $ref: '#/components/schemas/Meta'
        cost_center_id:
          type:
            - "string"
            - "null"
          description: Cost center identifier.
          maxLength: 45
        accounting_id:
          type:
            - "string"
            - "null"
          description: Accounting identifier. Only superadmin/accounting roles can set this.
          maxLength: 45
        deposit_amount:
          type: integer
          description: Deposit amount.
          default: 0
        low_level_deposit:
          type: integer
          description: Low level deposit threshold.
          default: 0
        issue_1099:
          type: integer
          description: 1 is true, 0 is false.
          enum: [0, 1]
        employee_payroll_file:
          type: integer
          description: 1 is true, 0 is false.
          enum: [0, 1]
        contact:
          $ref: '#/components/schemas/Contact'
        accounting_contact:
          $ref: '#/components/schemas/Contact'
        productCriteria:
          $ref: '#/components/schemas/ProductCriteria'
        featured_products:
          type: array
          items:
            $ref: '#/components/schemas/ProductSku'
        auto_redemption:
          oneOf:
            - $ref: '#/components/schemas/AutoRedemption'
            - type: 'null'
          description: Null when auto-redemption is not configured for this program.
        one_time_auto_redemptions:
          type: array
          items:
            $ref: '#/components/schemas/OneTimeAutoRedemption'
        programTypes:
          type: array
          items:
            $ref: '#/components/schemas/ProgramType'
        actions:
          oneOf:
            - $ref: '#/components/schemas/Actions'
            - type: array
              maxItems: 0
          description: >-
            Map of available action booleans, keyed by action name. Serializes
            as an empty array ([]) rather than an object when the program has
            no assigned program types.
    ProgramCreate:
      type: object
      required:
        - unique_id
        - name
        - point
        - organization
      properties:
        unique_id:
          type: string
          description: >-
            Program unique identifier. Alphanumeric with hyphens and underscores only.
            No whitespace allowed.
          minLength: 1
          maxLength: 45
          pattern: '^[a-zA-Z0-9_-]+$'
        name:
          type: string
          description: The name of the program.
          minLength: 1
          maxLength: 125
        point:
          type: number
          description: The point-to-USD ratio. e.g. 1 means 1 point = $1 USD.
          minimum: 1
        organization:
          type: string
          description: Organization unique_id to assign this program to.
        url:
          type: string
          description: Full domain URL (subdomain.domain format).
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
          default: 1
        point_sharing:
          type: integer
          description: >-
            1 enables point sharing between participants, 0 disables it.
            When enabled, adjustments can be marked as shareable and
            participants can share their shareable points with others.
          enum: [0, 1]
          default: 0
        share_total_max:
          type: number
          nullable: true
          description: >-
            Lifetime maximum a participant may share in this program. Send
            null to clear the limit. Preserved if omitted.
        share_per_transaction_max:
          type: number
          nullable: true
          description: >-
            Maximum amount a participant may share in a single transaction.
            Send null to clear the limit. Preserved if omitted.
        share_daily_max:
          type: number
          nullable: true
          description: >-
            Maximum amount a participant may share per day. Send null to
            clear the limit. Preserved if omitted.
        share_weekly_max:
          type: number
          nullable: true
          description: >-
            Maximum amount a participant may share per week. Send null to
            clear the limit. Preserved if omitted.
        share_monthly_max:
          type: number
          nullable: true
          description: >-
            Maximum amount a participant may share per month. Send null to
            clear the limit. Preserved if omitted.
        published:
          type: integer
          description: 1 is published, 0 is unpublished.
          enum: [0, 1]
        start_date:
          type: string
          description: Program start date (YYYY-MM-DD).
        end_date:
          type: string
          description: Program end date (YYYY-MM-DD HH:MM:SS).
        grace_period:
          type: integer
          description: The number of days after end_date that the program remains active.
        enable_email_login:
          type: integer
          description: >-
            0 = Disabled, 1 = enabled. When enabled, participants can
            login to the marketplace using their email address and password.
          enum: [0, 1]
          default: 0
        timezone:
          type: string
          description: >-
            Program timezone. Must be a valid timezone ID. Options include:
            America/New_York, America/Chicago, America/Denver, America/Phoenix,
            America/Los_Angeles, America/Anchorage, America/Adak, Pacific/Honolulu.
          default: America/Phoenix
        collect_ssn:
          type: integer
          description: 1 to collect SSN, 0 to not.
          enum: [0, 1]
        is_avs:
          type: integer
          description: 1 to enable address verification on transactions, 0 to disable.
          enum: [0, 1]
          default: 0
        deposit_amount:
          type: number
          description: Deposit amount.
        low_level_deposit:
          type: number
          description: Low level deposit threshold.
        issue_1099:
          type: integer
          description: 1 is true, 0 is false.
          enum: [0, 1]
        employee_payroll_file:
          type: integer
          description: 1 is true, 0 is false.
          enum: [0, 1]
        cost_center_id:
          type: string
          description: Cost center identifier.
          maxLength: 45
        accounting_id:
          type:
            - "string"
            - "null"
          description: Accounting identifier. Only superadmin/accounting roles can set this.
          maxLength: 45
        contact:
          $ref: '#/components/schemas/ContactWrite'
        accounting_contact:
          $ref: '#/components/schemas/ContactWrite'
        auto_redemption:
          type: object
          description: Auto-redemption settings. product_sku is required if this object is provided.
          properties:
            product_sku:
              type: string
              description: SKU of the product for auto-redemption.
            active:
              type: integer
              enum: [0, 1]
            all_participant:
              type: integer
              enum: [0, 1]
        one_time_auto_redemptions:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
              active:
                type: integer
                enum: [0, 1]
              participant_count:
                type: integer
        programTypes:
          type: array
          description: Array of program type IDs.
          items:
            type: integer
    ProgramUpdate:
      type: object
      description: >-
        Program update request body. Only include fields you wish to change.
        unique_id cannot be changed. Setting active=0 also sets published=0.
      properties:
        name:
          type: string
          description: The name of the program.
          minLength: 1
          maxLength: 125
        point:
          type: number
          description: >-
            The point-to-USD ratio. Immutable after the program is created:
            sending a different value than the program already has fails with
            400. Sending the same value is fine.
          minimum: 1
        url:
          type: string
          description: Full domain URL (subdomain.domain format).
        active:
          type: integer
          description: 1 for active, 0 for inactive. Setting to 0 also sets published to 0.
          enum: [0, 1]
        point_sharing:
          type: integer
          description: >-
            1 enables point sharing between participants, 0 disables it.
            Cannot be disabled if shareable adjustments exist in the program.
          enum: [0, 1]
        share_total_max:
          type: number
          nullable: true
          description: >-
            Lifetime maximum a participant may share in this program. Send
            null to clear the limit. Preserved if omitted.
        share_per_transaction_max:
          type: number
          nullable: true
          description: >-
            Maximum amount a participant may share in a single transaction.
            Send null to clear the limit. Preserved if omitted.
        share_daily_max:
          type: number
          nullable: true
          description: >-
            Maximum amount a participant may share per day. Send null to
            clear the limit. Preserved if omitted.
        share_weekly_max:
          type: number
          nullable: true
          description: >-
            Maximum amount a participant may share per week. Send null to
            clear the limit. Preserved if omitted.
        share_monthly_max:
          type: number
          nullable: true
          description: >-
            Maximum amount a participant may share per month. Send null to
            clear the limit. Preserved if omitted.
        published:
          type: integer
          description: 1 is published, 0 is unpublished.
          enum: [0, 1]
        start_date:
          type: string
          description: Program start date (YYYY-MM-DD).
        end_date:
          type: string
          description: Program end date (YYYY-MM-DD HH:MM:SS).
        grace_period:
          type: integer
          description: Days after end_date that the program remains active.
        enable_email_login:
          type: integer
          description: 0 = Disabled, 1 = enabled.
          enum: [0, 1]
        timezone:
          type: string
          description: Program timezone. Must be a valid timezone ID.
        collect_ssn:
          type: integer
          enum: [0, 1]
        is_avs:
          type: integer
          enum: [0, 1]
        deposit_amount:
          type: number
        low_level_deposit:
          type: number
        issue_1099:
          type: integer
          enum: [0, 1]
        employee_payroll_file:
          type: integer
          enum: [0, 1]
        cost_center_id:
          type: string
          maxLength: 45
        accounting_id:
          type:
            - "string"
            - "null"
          description: Only superadmin/accounting roles can modify this.
          maxLength: 45
        contact:
          $ref: '#/components/schemas/ContactWrite'
        accounting_contact:
          $ref: '#/components/schemas/ContactWrite'
        auto_redemption:
          type: object
          properties:
            product_sku:
              type: string
            active:
              type: integer
              enum: [0, 1]
            all_participant:
              type: integer
              enum: [0, 1]
        one_time_auto_redemptions:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
              active:
                type: integer
                enum: [0, 1]
              participant_count:
                type: integer
        programTypes:
          type: array
          items:
            type: integer
    ProgramMetrics:
      description: Basic program metrics.
      type: object
      properties:
        participant_total:
          description: Total number of active participants.
          type: integer
        transaction_total:
          description: Total number of transactions.
          type: integer
        adjustment_total:
          description: Total number of point adjustments.
          type: integer
    OrganizationList:
      type: object
      description: >-
        Organization object as returned in list responses. `industry_program`
        and `updated_at` are always null here and `domains` is not returned;
        read a single organization for them.
      properties:
        unique_id:
          type: string
          description: The unique identifier of the organization.
          minLength: 2
          maxLength: 45
          pattern: '^[a-zA-Z0-9_-]+$'
        name:
          type: string
          description: The name of the organization.
          minLength: 2
          maxLength: 50
        industry_program:
          type:
            - "integer"
            - "null"
          description: >-
            Not filled in list responses: always null. Read a single
            organization for the value.
        program_count:
          description: The number of programs configured under this organization.
          type: integer
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        parent:
          type:
            - "string"
            - "null"
          description: Parent organization unique_id.
        created_at:
          type: string
          description: Timestamp (Y-m-d H:i:s).
        updated_at:
          type:
            - "string"
            - "null"
          description: >-
            Not filled in list responses: always null. Read a single
            organization for the value.
    OrganizationRead:
      type: object
      description: Full organization object.
      properties:
        unique_id:
          type: string
          description: The unique identifier of the organization.
          minLength: 2
          maxLength: 45
        parent:
          type:
            - "string"
            - "null"
          description: The parent organization unique_id.
        name:
          type: string
          description: The name of the organization.
          minLength: 2
          maxLength: 50
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type: string
          description: Last update timestamp (Y-m-d H:i:s).
        domains:
          type: array
          description: >-
            Domain URLs associated with this organization. Each domain must match
            the pattern for a valid domain URL and be unique across all organizations.
          items:
            type: string
        industry_program:
          type:
            - "integer"
            - "null"
          description: >-
            Industry program types: 1 = Health_Wellness, 2 = Channel_Sales,
            3 = Employee_Recognition, 4 = Consumer, 5 = Market_Research,
            6 = Loyalty_Marketing, 7 = Rebates. Null until set.
          enum: [1, 2, 3, 4, 5, 6, 7, null]
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        program_count:
          type: integer
          description: The number of programs configured under this organization.
        company_contact:
          $ref: '#/components/schemas/Contact'
        accounts_payable_contact:
          $ref: '#/components/schemas/Contact'
    OrganizationCreate:
      type: object
      required:
        - unique_id
        - name
        - parent
      properties:
        unique_id:
          type: string
          description: >-
            The unique identifier for the organization. Alphanumeric with hyphens
            and underscores only.
          minLength: 2
          maxLength: 45
          pattern: '^[a-zA-Z0-9_-]+$'
        parent:
          type: string
          description: >-
            The parent organization unique_id. Required. Must reference an existing
            organization. Cannot create circular references.
        name:
          type: string
          description: The name of the organization.
          minLength: 2
          maxLength: 50
        domains:
          type: array
          description: >-
            Domain URLs to associate with this organization. Each must be a valid
            domain URL and unique across all organizations. Converted to lowercase.
          items:
            type: string
        industry_program:
          $ref: '#/components/schemas/IndustryProgramEnum'
        company_contact:
          $ref: '#/components/schemas/ContactWrite'
        accounts_payable_contact:
          $ref: '#/components/schemas/ContactWrite'
    OrganizationUpdate:
      type: object
      description: >-
        Organization update request body. This is not a partial update: send
        `name`, `unique_id` and `parent` every time, as on create. `unique_id`
        and `parent` cannot be changed on update; send their current values.
      required:
        - unique_id
        - name
        - parent
      properties:
        unique_id:
          type: string
          description: The organization's current unique_id. It cannot be changed.
        parent:
          type: string
          description: The organization's current parent unique_id. It cannot be changed.
        name:
          type: string
          description: The name of the organization.
          minLength: 1
          maxLength: 50
        domains:
          type: array
          description: >-
            Domains to add. They are added to the organization's existing
            domains; domains already on the organization are not removed. Each
            must be a valid domain URL and unique across all organizations.
          items:
            type: string
        industry_program:
          description: >-
            Industry program type. Can only be set once; cannot be unset after initial assignment.
          $ref: '#/components/schemas/IndustryProgramEnum'
        company_contact:
          $ref: '#/components/schemas/ContactWrite'
        accounts_payable_contact:
          $ref: '#/components/schemas/ContactWrite'
    WebhookCreate:
      type: object
      required:
        - title
        - url
        - event
      properties:
        title:
          type: string
          description: Webhook title.
          minLength: 1
          maxLength: 255
        url:
          type: string
          description: >-
            URL the webhook POSTs data to. Must start with https:// and be between
            11 and 255 characters. Cannot point to private/reserved IP addresses.
          minLength: 11
          maxLength: 255
        event:
          type: string
          description: Which event triggers this webhook (e.g. Transaction.create).
          minLength: 1
          maxLength: 255
        auth_type:
          type:
            - "string"
            - "null"
          description: Authentication type for the webhook endpoint.
          enum:
            - Bearer
            - Basic
        username:
          type:
            - "string"
            - "null"
          description: Username for basic authentication.
        password:
          type:
            - "string"
            - "null"
          description: Password for basic authentication.
        active:
          type:
            - "integer"
            - "boolean"
          description: >-
            Is this webhook active? 1 or true = active, 0 or false = inactive.
            When left out, the webhook is active.
          enum: [0, 1, true, false]
          default: 1
        immutable:
          type: integer
          description: Can this webhook be modified? 0 = mutable, 1 = immutable.
          enum: [0, 1]
    WebhookRead:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier of the webhook.
        title:
          type: string
          description: Webhook title.
        url:
          type: string
          description: URL the webhook POSTs data to.
        event:
          type: string
          description: Which event triggers this webhook.
        auth_type:
          type:
            - "string"
            - "null"
          description: Authentication type (Bearer or Basic).
        active:
          type: integer
          description: Is this webhook active? 0 = false, 1 = true.
          enum: [0, 1]
        immutable:
          type: integer
          description: Can this webhook be modified? 0 = mutable, 1 = immutable.
          enum: [0, 1]
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type:
            - "string"
            - "null"
          description: Last update timestamp (Y-m-d H:i:s), or null.
    WebhookLog:
      type: object
      properties:
        _id:
          type: object
          properties:
            $oid:
              type: string
              description: MongoDB ObjectId.
        request_time:
          type: object
        http_status:
          type: integer
          description: >-
            Most recent HTTP status response from the webhook's last attempt.
        responses:
          type: array
          items:
            $ref: '#/components/schemas/httpResponse'
        request:
          $ref: '#/components/schemas/httpRequest'
    WebhookReplayResponse:
      type: object
      properties:
        http_status_code:
          description: >-
            The HTTP response status code from the server the webhook was replayed to,
            or the string "Failed" if the connection failed.
          oneOf:
            - type: integer
            - type: string
              enum: ["Failed"]
    httpRequest:
      type: object
      properties:
        headers:
          type: object
          description: Request headers (Authorization header is stripped).
        body:
          type: string
    httpResponse:
      allOf:
        - $ref: '#/components/schemas/httpRequest'
        - type: object
          properties:
            http_status:
              type: integer
    CreateTransaction:
      type: object
      required:
        - products
      properties:
        products:
          type: array
          description: Array of products for the transaction. At least one product is required.
          items:
            $ref: '#/components/schemas/ProductForTransaction'
        issue_points:
          type: boolean
          description: >-
            When true, credits the participant with enough points to cover the
            transaction cost before processing. Defaults to false.
          default: false
        shipping:
          $ref: '#/components/schemas/CreateTransactionShipping'
        email_address:
          type: string
          description: >-
            Email address for the transaction. Must be a valid email.
            Required for digital products if participant has no email on file.
        phone:
          type: string
          description: Phone number for the transaction. Must be a valid phone number if provided.
        unique_id:
          type: string
          description: Optional transaction unique identifier.
        transaction_source:
          type: string
          description: >-
            Transaction source identifier. Reserved values (AUTO_REDEMPTION,
            MARKETPLACE, CUSTOMER_SERVICE, GAMES, KIA_KASH, REDEMPTION_CAMPAIGNS,
            SWEEPSTAKE) cannot be used unless the caller is a superadmin.
        avs_disabled:
          type: boolean
          description: >-
            When true, disables Address Verification Service for this transaction
            even if the program has AVS enabled. Defaults to false.
          default: false
        meta:
          type: array
          items:
            $ref: '#/components/schemas/Meta'
    Transaction:
      type: object
      description: Response shape for a single transaction (create and single GET).
      properties:
        id:
          type: integer
        unique_id:
          type:
            - "string"
            - "null"
        wholesale:
          type: string
          description: >-
            Returned as a quoted decimal string (for example "0.00"), not a
            JSON number.
        subtotal:
          type: string
          description: >-
            Returned as a quoted decimal string (for example "0.00"), not a
            JSON number.
        total:
          type: string
          description: >-
            Returned as a quoted decimal string (for example "0.00"), not a
            JSON number.
        points:
          type: string
          description: >-
            Total points cost (total * program point ratio). Returned as a
            quoted decimal string (for example "0.00"), not a JSON number.
        email_address:
          type: string
        phone:
          type: string
        type:
          type: integer
          description: Transaction type.
        transaction_source:
          type: string
          description: Transaction source identifier.
        locale:
          type: string
          description: Locale the transaction was placed in (for example en_US).
        created_at:
          type: string
        updated_at:
          type:
            - "string"
            - "null"
        shipping:
          $ref: '#/components/schemas/TransactionAddressRead'
        meta:
          type: array
          items:
            $ref: '#/components/schemas/Meta'
        products:
          type: array
          items:
            $ref: '#/components/schemas/TransactionProductRead'
        user:
          $ref: '#/components/schemas/ParticipantRead'
    TransactionListRead:
      type: object
      description: >-
        Response shape for a transaction list item (GET .../transaction and
        GET .../transaction/items). Does not carry points, shipping, user,
        or the per-product var_amount/program_fee fields that the single
        Transaction response has.
      properties:
        id:
          type: integer
        unique_id:
          type:
            - "string"
            - "null"
        wholesale:
          type: string
          description: >-
            Returned as a quoted decimal string (for example "0.00"), not a
            JSON number.
        subtotal:
          type: string
          description: >-
            Returned as a quoted decimal string (for example "0.00"), not a
            JSON number.
        total:
          type: string
          description: >-
            Returned as a quoted decimal string (for example "0.00"), not a
            JSON number.
        email_address:
          type: string
        phone:
          type: string
        type:
          type: integer
          description: Transaction type.
        transaction_source:
          type: string
          description: Transaction source identifier.
        locale:
          type: string
          description: Locale the transaction was placed in (for example en_US).
        created_at:
          type: string
        updated_at:
          type:
            - "string"
            - "null"
        meta:
          type: array
          items:
            $ref: '#/components/schemas/Meta'
        products:
          type: array
          items:
            $ref: '#/components/schemas/TransactionListProductRead'
    TransactionProductRead:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        quantity:
          type: integer
        total:
          type: string
          description: >-
            Returned as a quoted decimal string (for example "0.00"), not a
            JSON number.
        points:
          type: string
          description: >-
            Returned as a quoted decimal string (for example "0.00"), not a
            JSON number.
        guid:
          type: string
          description: Unique GUID for this transaction item.
        reissue_date:
          type:
            - "string"
            - "null"
          description: Reissue date (YYYY-MM-DD), null if not reissued.
        returned:
          type: boolean
          description: Whether the item has been returned.
        var_amount:
          type: string
          description: >-
            Variable amount for ranged-price products. Returned as a quoted
            decimal string (for example "0.00"), not a JSON number.
        program_fee:
          type: string
          description: >-
            Returned as a quoted decimal string (for example "0.00"), not a
            JSON number.
        terms_approved:
          type: integer
          description: 1 if terms were approved, 0 if not.
          enum: [0, 1]
        is_digital:
          type: integer
          description: 1 for digital, 0 for physical.
          enum: [0, 1]
        is_wallet_enabled:
          type: integer
          description: 1 if wallet enabled, 0 if not.
          enum: [0, 1]
        is_redemption:
          type: integer
          description: 1 if this is a redemption-vendor product, 0 if not.
          enum: [0, 1]
    TransactionListProductRead:
      type: object
      description: >-
        Per-product line on a transaction list item. Does not carry
        var_amount or program_fee, unlike TransactionProductRead.
      properties:
        name:
          type: string
        sku:
          type: string
        quantity:
          type: integer
        total:
          type: string
          description: >-
            Returned as a quoted decimal string (for example "0.00"), not a
            JSON number.
        points:
          type: string
          description: >-
            Returned as a quoted decimal string (for example "0.00"), not a
            JSON number.
        guid:
          type: string
          description: Unique GUID for this transaction item.
        reissue_date:
          type:
            - "string"
            - "null"
          description: Reissue date (YYYY-MM-DD), null if not reissued.
        terms_approved:
          type: integer
          description: 1 if terms were approved, 0 if not.
          enum: [0, 1]
        is_digital:
          type: integer
          description: 1 for digital, 0 for physical.
          enum: [0, 1]
        returned:
          type: boolean
          description: Whether the item has been returned.
        is_wallet_enabled:
          type: integer
          description: 1 if wallet enabled, 0 if not.
          enum: [0, 1]
        is_redemption:
          type: integer
          description: 1 if this is a redemption-vendor product, 0 if not.
          enum: [0, 1]
    ProductForTransaction:
      type: object
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
          description: Product SKU (converted to uppercase).
        quantity:
          type: integer
          description: Quantity to order. Must be greater than 0.
          minimum: 1
        amount:
          type: number
          description: >-
            Required for ranged-price products. The dollar amount to apply.
            Must be within the product's min/max price range.
    ParticipantIdArray:
      type: object
      required:
        - participant_id
      properties:
        participant_id:
          type: array
          description: Array of participant unique IDs to fetch.
          items:
            type: string
          example:
            - UNIQUE_ID1
            - UNIQUE_ID2
            - UNIQUE_ID3
    Meta:
      type: object
      description: A single key-value metadata pair. The key is the property name and the value is its value.
      additionalProperties:
        type: string
      example:
        department: "Engineering"
    ProductSku:
      type: string
    Address:
      type: object
      properties:
        firstname:
          type: string
          description: Recipient first name. Required for physical product shipments.
        lastname:
          type: string
          description: Recipient last name.
        address1:
          type: string
          description: Street address line 1.
        address2:
          type: string
          description: Street address line 2.
        city:
          type: string
          description: City.
        state:
          type: string
          description: State abbreviation (e.g. NY). Required for US shipments with physical items.
        zip:
          type: string
          description: Postal/ZIP code.
        country_code:
          type: string
          description: Two-letter country code (e.g. US, CA).
          maxLength: 2
          default: US
    CreateTransactionShipping:
      type: object
      description: >-
        Shipping address for a transaction. Unlike the participant Address
        schema, the country field here is named country, not country_code.
      properties:
        firstname:
          type: string
          description: Recipient first name. Required for physical product shipments.
        lastname:
          type: string
          description: Recipient last name.
        address1:
          type: string
          description: Street address line 1.
        address2:
          type: string
          description: Street address line 2.
        city:
          type: string
          description: City.
        state:
          type: string
          description: State abbreviation (e.g. NY). Required for US shipments with physical items.
        zip:
          type: string
          description: Postal/ZIP code.
        country:
          type: string
          description: Two-letter country code (e.g. US, CA).
          maxLength: 2
          default: US
    TransactionAddressRead:
      type: object
      properties:
        firstname:
          type: string
        lastname:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
          description: Country name or code.
        country_code:
          type: string
          description: Two-letter country code.
    PointRead:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: string
          description: >-
            Point amount (displayed as amount * program point ratio).
            Returned as a quoted decimal string (for example "0.00"), not a
            JSON number.
        type:
          type: string
          description: '"credit" to add points, "debit" to subtract points.'
          enum:
            - credit
            - debit
        reference:
          type:
            - "string"
            - "null"
          description: Reference identifier for client internal use.
        description:
          type:
            - "string"
            - "null"
          description: Description visible to the participant.
        shareable:
          type: integer
          description: >-
            1 indicates the adjustment affects shareable points, 0 indicates
            it affects earned (non-shareable) points. Shareable points can
            be transferred to other participants when point sharing is enabled.
          enum: [0, 1]
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type: string
          description: Last update timestamp (Y-m-d H:i:s).
        transaction_id:
          type:
            - "integer"
            - "null"
          description: Associated transaction ID, null for manual adjustments.
        transaction_item_id:
          type:
            - "integer"
            - "null"
        completed_at:
          type:
            - "string"
            - "null"
          description: Date the activity was completed (YYYY-MM-DD).
        activity:
          type:
            - "string"
            - "null"
          description: Activity label for the adjustment.
        sender_participant_id:
          type:
            - "integer"
            - "null"
          description: >-
            Present on every adjustment. Populated with the sharer's
            internal participant id only on the credit row a point share
            creates for the recipient; null otherwise.
        share_direction:
          type: string
          enum: [sent, received]
          description: >-
            Only present in the list response (GET .../adjustment), and only
            on rows created by a point share: sent on the sharer's debit
            row, received on the recipient's credit row.
        counterparty_name:
          type:
            - "string"
            - "null"
          description: >-
            Only present in the list response, on point-share rows. The
            other participant's name, or email if no name is on file.
        share_message:
          type:
            - "string"
            - "null"
          description: >-
            Only present in the list response, on point-share rows. The
            message sent with the share, if any.
    PointReadWithUser:
      allOf:
        - $ref: '#/components/schemas/PointRead'
        - type: object
          properties:
            user:
              $ref: '#/components/schemas/ParticipantRead'
    PointWrite:
      type: object
      required:
        - amount
        - type
      properties:
        amount:
          type: number
          description: >-
            Point amount. Must be positive and non-empty. Credit adjustments
            cannot cause the total to exceed 99999999.99.
          minimum: 0
          exclusiveMinimum: true
        type:
          type: string
          description: '"credit" to add points, "debit" to subtract points.'
          enum:
            - credit
            - debit
        reference:
          type: string
          description: Reference identifier for client use.
        completed_at:
          type: string
          description: >-
            YYYY-MM-DD. Optional reference to the date a participant completed
            the activity to receive the points. This can be used if the date
            the points are credited via the API is after the date the
            participant earned the points.
        description:
          type: string
          description: Description visible to participant.
        activity:
          type: string
          description: Activity label for the adjustment.
        shareable:
          type: integer
          description: >-
            Set to 1 to mark this adjustment as shareable. Shareable points
            are added to the participant's shared_credit balance and can be
            transferred to other participants. Requires point_sharing to be
            enabled on the program. Default is 0 (non-shareable).
          enum: [0, 1]
          default: 0
    PointUpdate:
      type: object
      description: >-
        Update adjustment metadata. Amount and type cannot be changed after creation.
      properties:
        reference:
          type: string
          description: Reference identifier for client use.
        completed_at:
          type: string
          description: >-
            YYYY-MM-DD. Optional reference to the date a participant completed
            the activity to receive the points.
        description:
          type: string
          description: Description visible to participant.
        activity:
          type: string
          description: >-
            Activity label for the adjustment. If left out of the body, the
            existing value is cleared to an empty string rather than left
            unchanged; send the current value back to keep it.
    SharePointsRequest:
      type: object
      description: Request body for sharing points between participants.
      required:
        - recipient_email
        - amount
      properties:
        recipient_email:
          type: string
          format: email
          description: >-
            Email address of the participant receiving the points. Must be
            an active participant in the same program as the sharer.
        amount:
          type: number
          minimum: 0.01
          description: >-
            Amount of shareable points to transfer. Must be greater than zero
            and cannot exceed the sharer's shared_credit balance.
        message:
          type: string
          maxLength: 255
          description: >-
            Optional message to accompany the share. Trimmed and truncated to
            255 characters.
    SharePointsResponse:
      type: object
      description: Response body after successfully sharing points.
      properties:
        credit:
          type: string
          description: >-
            The sharer's remaining earned (non-shareable) point balance.
            Returned as a quoted decimal string (for example "0.00"), not a
            JSON number.
        shared_credit:
          type: string
          description: >-
            The sharer's remaining shareable point balance after the
            transfer. Returned as a quoted decimal string (for example
            "0.00"), not a JSON number.
    ReturnRead:
      type: object
