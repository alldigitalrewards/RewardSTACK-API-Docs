              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceAwardParticipant'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardError'
        '401':
          $ref: '#/components/responses/ServiceAwardUnauthorized'
        '500':
          description: Failed to retrieve participant data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardError'
        default:
          description: Unknown exception
    post:
      tags:
        - Service Award
      summary: Enroll participants in a service award
      operationId: bulkUpsertServiceAwardParticipants
      security:
        - Bearer: [ ]
      description: >-
        Enroll one or more participants in a service award by providing their
        unique identifier and milestone date (e.g. hire date). If a participant
        is already enrolled, their date will be updated. Participants are
        validated against the program before enrollment. If the award has
        issuance emails enabled, enrolled participants will receive a
        notification.
      parameters:
        - name: programId
          in: path
          required: true
          description: The unique identifier of the program.
          schema:
            type: string
            format: uuid
        - name: serviceAwardId
          in: path
          required: true
          description: The unique identifier of the service award.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ServiceAwardParticipantWrite'
            example:
              - participant_id: "participant-unique-id-1"
                date: "2020-03-15"
              - participant_id: "participant-unique-id-2"
                date: "2021-06-01"
      responses:
        '201':
          description: All participants enrolled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardBulkResponse'
        '207':
          description: Partial success — some participants failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardBulkResponse'
        '400':
          description: >-
            Validation error (e.g. missing required fields or invalid date
            format). If every participant in the request fails, the
            response adds a summary and the per-participant errors instead
            of a plain error message.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ServiceAwardError'
                  - type: object
                    description: Returned when every participant in the request failed.
                    properties:
                      error:
                        type: string
                      summary:
                        type: object
                        properties:
                          total_participants:
                            type: integer
                          successful:
                            type: integer
                          failed:
                            type: integer
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            participant_id:
                              type: string
                            error_type:
                              type: string
                              enum:
                                - validation_error
                                - email_processing_error
        '401':
          $ref: '#/components/responses/ServiceAwardUnauthorized'
        '500':
          description: Bulk upsert operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardError'
        default:
          description: Unknown exception
