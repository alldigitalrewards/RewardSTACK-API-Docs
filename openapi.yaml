  /api/program/{programId}/participant/{uniqueId}/share:
    post:
      tags:
        - point sharing
      summary: Share points with another participant
      description: >-
        Transfer shareable points from one participant to another within the
        same program. The sharer must have sufficient shareable points
        (shared_credit balance) and point_sharing must be enabled on the
        program. Both participants must be active. One successful share
        writes two point adjustment rows under one shared reference: a debit
        on the sharer and a credit on the recipient. Both rows are visible
        on GET .../adjustment for the respective participant.
      operationId: sharePoints
      security:
        - Bearer: [ ]
      parameters:
        - name: programId
          in: path
          required: true
          description: The Program Unique Identifier.
          schema:
            type: string
            format: uuid
        - name: uniqueId
          in: path
          required: true
          description: Unique ID of the participant sharing points.
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharePointsRequest'
        description: Point sharing request details.
        required: true
      responses:
        '201':
          description: Points shared successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePointsResponse'
        '400':
          description: >-
            Bad request. Returned for most error cases, including when the
            sharer participant exists but is not in this program ("Resource
            does not exist"). Other reasons: insufficient shareable points,
            recipient not found in the program, cannot share with yourself,
            recipient is inactive, amount must be greater than zero, point
            sharing is not enabled on the program, or a configured sharing
            limit (per transaction, daily, weekly, monthly, or total) has
            been reached. A sharer that does not exist at all, or is not
            active, gets a {"message": ...} body instead.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    description: A list of one or more validation error messages.
                    items:
                      type: string
                    example:
                      - "Insufficient shareable points"
                  - type: object
                    description: >-
                      Returned when a configured program sharing limit is
                      reached. Adds the maximum amount the participant may
                      currently share and which threshold is limiting it.
                    properties:
                      errors:
                        type: array
                        items:
                          type: string
                      max_shareable:
                        type: number
                        description: >-
                          The maximum amount the participant can currently
                          share given the limiting threshold.
                      limiting_threshold:
                        type:
                          - "string"
                          - "null"
                        description: >-
                          Which configured limit is being hit (for example
                          per_transaction, daily, weekly, monthly, total, or
                          balance). May be null.
                  - $ref: '#/components/schemas/MessageResponse'
              example:
                message: Participant not active
        '401':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No response body when the program itself does not exist.
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          description: Unknown exception
  /api/transaction/{transactionGuid}:
    get:
      tags:
        - Transaction
      summary: Resolve a transaction item GUID to its transaction and owner.
      operationId: getTransactionByGuid
      security:
        - Bearer: [ ]
      description: >-
        Looks up a transaction item GUID and returns the identifiers needed
        to then call the participant-scoped transaction endpoints. Not
        scoped to a program or participant in the URL.
