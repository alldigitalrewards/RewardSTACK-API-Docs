components:
  requestBodies:
    WebhookCreate:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookCreate'
      required: true
    MetaArray:
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Meta'
      description: Array of key-value meta objects.
      required: true
    UserWrite:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserWrite'
      description: Participant object.
      required: true
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    Bearer:
      description: >-
        For accessing the API, a valid JSON Web Token must be passed in all
        queries via the "Authorization" header. You may request a new JSON Web
        token at the following endpoint: /token, with the API User and Password
        credentials for the organization you are actioning.
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    JwtRequest:
      type: object
      description: >-
        Token generation parameters. These are passed as query parameters, not in
        the JSON body.
      properties:
        hoursUntilExpiry:
          type: integer
          description: Number of hours until the token expires.
          minimum: 1
          maximum: 8760
          default: 2
        tokenName:
          type: string
          description: Optional name for the token.
          maxLength: 255
    JwtResponse:
      type: object
      properties:
        token:
          type: string
          description: The JWT token string (HS256 encoded).
        expires:
          type: integer
          description: Unix timestamp when the token expires.
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    UserList:
      type: object
      description: >-
        Participant object as returned in list responses. Address, meta, and birthdate
        are excluded from list views to reduce payload size. PII fields may be excluded
        for users with limited access.
      properties:
        unique_id:
          type: string
          description: Participant unique identifier.
          minLength: 2
          maxLength: 45
        email_address:
          type: string
          description: Participant email address.
        credit:
          type: number
          description: The participant's earned (non-shareable) point balance.
        shared_credit:
          type: number
          description: The participant's shareable point balance.
        firstname:
          type: string
          description: Participant first name.
          maxLength: 50
        lastname:
          type: string
          description: Participant last name.
          maxLength: 50
        phone:
          type: string
          description: Participant phone number.
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        status:
          $ref: '#/components/schemas/UserStatusEnum'
        language:
          type: string
          description: Language preference.
          default: en
        transactions_disabled:
          type: integer
          description: Whether transactions are disabled for this participant. 0 = enabled, 1 = disabled.
          enum: [0, 1]
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type: string
          description: Last update timestamp (Y-m-d H:i:s).
        deactivated_at:
          type:
            - "string"
            - "null"
          description: Deactivation timestamp (Y-m-d H:i:s), null if active.
        program:
          type: string
          description: The assigned program unique_id.
        organization:
          type: string
          description: The assigned organization unique_id.
    UserWrite:
      type: object
      description: Participant create/update request body.
      properties:
        email_address:
          type: string
          description: >-
            Participant email address. Required on create. Must be a valid email format.
            Must be unique per program when email login is enabled.
        program:
          type: string
          description: >-
            The program unique_id the participant belongs to. Required on create.
        unique_id:
          type: string
          description: >-
            Participant unique identifier. Optional on create (auto-generated UUID if omitted).
            Cannot be changed on update. Alphanumeric with hyphens and underscores only.
          minLength: 2
          maxLength: 45
          pattern: '^[a-zA-Z0-9_-]+$'
        firstname:
          type: string
          description: Participant first name. No emojis allowed.
          maxLength: 50
        lastname:
          type: string
          description: Participant last name. No emojis allowed.
          maxLength: 50
        phone:
          type: string
          description: Participant phone number.
        birthdate:
          type: string
          description: Participant birthdate in YYYY-MM-DD format.
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '1990-01-15'
        password:
          type: string
          description: Participant password. If provided, password_confirm must also be provided and match.
        password_confirm:
          type: string
          description: Must match password if password is provided.
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
          default: 1
        status:
          $ref: '#/components/schemas/UserStatusEnum'
        language:
          type: string
          description: Language preference.
          default: en
        address:
          $ref: '#/components/schemas/Address'
        meta:
          type: array
          description: Array of key-value metadata pairs. On PUT, replaces all existing meta.
          items:
            $ref: '#/components/schemas/Meta'
    ParticipantRead:
      type: object
      description: >-
        Full participant object returned on single-resource GET, create, and update responses.
        Includes address and meta data. PII fields may be excluded for users with limited access.
      properties:
        unique_id:
          type: string
          description: Participant unique identifier.
        email_address:
          type: string
          description: Participant email address.
        credit:
          type: number
          description: The participant's earned (non-shareable) point balance.
        shared_credit:
          type: number
          description: >-
            The participant's shareable point balance. These points can be
            shared with other participants in the same program when point
            sharing is enabled.
        firstname:
          type: string
          description: Participant first name.
        lastname:
          type: string
          description: Participant last name.
        phone:
          type: string
          description: Participant phone number.
        birthdate:
          type: string
          description: Participant birthdate (YYYY-MM-DD).
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        status:
          $ref: '#/components/schemas/UserStatusEnum'
        language:
          type: string
          description: Language preference.
        transactions_disabled:
          type: integer
          description: Whether transactions are disabled. 0 = enabled, 1 = disabled.
          enum: [0, 1]
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type: string
          description: Last update timestamp (Y-m-d H:i:s).
        deactivated_at:
          type:
            - "string"
            - "null"
          description: Deactivation timestamp, null if active.
        address:
          $ref: '#/components/schemas/Address'
        program:
          type: string
          description: The assigned program unique_id.
        organization:
          type: string
          description: The assigned organization unique_id.
        meta:
          type: array
          items:
            $ref: '#/components/schemas/Meta'
    ParticipantSSO:
      type: object
      properties:
        token:
          type: string
          description: The SSO token.
        redirect:
          type: string
          description: The redirect URL, present if redirect parameter was provided.
    ProgramList:
      type: object
      description: Program object as returned in list responses.
      properties:
        unique_id:
          type: string
          description: Program unique identifier.
          maxLength: 45
        name:
          type: string
          description: The name of the program.
          maxLength: 125
        published:
          type: integer
          description: 1 is published, 0 is unpublished.
          enum: [0, 1]
        point:
          type: number
          description: The point-to-USD ratio. e.g. 1 means 1 point = $1 USD.
          minimum: 1
        url:
          type: string
          description: The full domain URL of the program (subdomain.domain).
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        is_avs:
          type: integer
          description: >-
            When 1, transactions created with shipping addresses will have
            their shipping addresses verified before creating the transaction.
          enum: [0, 1]
        enable_email_login:
          type: integer
          description: >-
            1 = enabled, 0 = disabled. When enabled, participants can
            login to the marketplace using their email address and password.
          enum: [0, 1]
          default: 0
        grace_period:
          type:
            - "integer"
            - "null"
          description: The number of days after end_date that the program remains active.
        timezone:
          type: string
          description: >-
            Program timezone. Options include: America/New_York, America/Chicago,
            America/Denver, America/Phoenix, America/Los_Angeles, America/Anchorage,
            America/Adak, Pacific/Honolulu.
          default: America/Phoenix
        start_date:
          type: string
          description: Program start date (YYYY-MM-DD).
        end_date:
          type: string
          description: Program end date (YYYY-MM-DD HH:MM:SS).
        created_at:
          type: string
          description: Creation timestamp (Y-m-d H:i:s).
        updated_at:
          type: string
          description: Last update timestamp (Y-m-d H:i:s).
        organization:
          type: string
          description: Organization unique_id.
        status:
          type: string
          description: Program status derived from active field.
        meta:
          type:
            - "array"
            - "null"
          items:
            $ref: '#/components/schemas/Meta'
    ProgramRead:
      type: object
      description: Full program object returned on single-resource GET, create, and update responses.
      properties:
        unique_id:
          type: string
          description: Program unique identifier.
          maxLength: 45
        name:
          type: string
          description: The name of the program.
          maxLength: 125
        published:
          type: integer
          description: 1 is published, 0 is unpublished.
          enum: [0, 1]
        collect_ssn:
          type: integer
          description: 1 is on, 0 is off.
          enum: [0, 1]
        is_avs:
          type: integer
          description: >-
            When 1, transactions created with shipping addresses will have
            their shipping addresses verified before creating the transaction.
            When 0, address verification does not occur on the transaction shipping address.
            Regardless of this setting, AVS is always enabled in the marketplace UI.
          enum: [0, 1]
        point:
          type: number
          description: The point-to-USD ratio. e.g. 1 means 1 point = $1 USD.
          minimum: 1
        url:
          type: string
          description: The full domain URL of the program (subdomain.domain).
        active:
          type: integer
          description: 1 for active, 0 for inactive.
          enum: [0, 1]
        point_sharing:
          type: integer
          description: >-
            1 enables point sharing between participants, 0 disables it.
            When enabled, participants can share their shareable points with
            other participants in the same program.
          enum: [0, 1]
        has_shareable_points:
          type: boolean
          description: >-
            Indicates whether the program has any shareable adjustments.
            When true, point_sharing cannot be disabled.
        share_link_label:
          type: string
          nullable: true
          description: Custom label for the participant-facing share link.
        share_total_max:
          type: number
          nullable: true
          description: >-
