          default: 0
        issue_1099:
          type: integer
          description: 1 is true, 0 is false.
          enum: [0, 1]
        employee_payroll_file:
          type: integer
          description: 1 is true, 0 is false.
          enum: [0, 1]
        contact:
          $ref: '#/components/schemas/Contact'
        accounting_contact:
          $ref: '#/components/schemas/Contact'
        productCriteria:
          $ref: '#/components/schemas/ProductCriteria'
        featured_products:
