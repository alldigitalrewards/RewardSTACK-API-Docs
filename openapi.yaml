      description: A participant enrolled in a service award.
      properties:
        id:
          type: string
          format: uuid
        participant_id:
          type: string
          format: uuid
          description: The unique identifier of the participant.
        service_award_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: The participant's milestone date (e.g. hire date). YYYY-MM-DD.
        created_at:
          type: string
        updated_at:
          type: string
        fulfillments:
          type: array
          description: History of reward fulfillments for this participant.
          items:
            $ref: '#/components/schemas/ServiceAwardFulfillment'
        most_recent_reward_date:
          type:
            - "string"
            - "null"
          format: date
          description: Date of the most recent fulfilled reward.
        next_reward_date:
          type:
            - "string"
            - "null"
          format: date
          description: Projected date of the next reward.
    ServiceAwardFulfillment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        processed_at:
          type:
            - "string"
            - "null"
          description: Datetime the fulfillment was processed.
        reward:
          type: string
          description: The reward type label (POINTS or SKU).
          enum:
            - POINTS
            - SKU
        reward_value:
          type: string
        reward_status:
          type: string
          description: Current status of the fulfillment.
          enum:
            - pending
            - processed
            - failed
        created_at:
          type: string
        updated_at:
          type: string
    ServiceAwardParticipantWrite:
      type: object
      required:
        - participant_id
        - date
      properties:
        participant_id:
          type: string
          description: The unique identifier of the participant to enroll.
        date:
          type: string
          format: date
          description: >-
            The participant's milestone date (e.g. hire date) in YYYY-MM-DD
            format. This date is used to calculate when rewards should be issued.
    ServiceAwardBulkResponse:
      type: object
      description: Summary of a bulk participant enrollment operation.
      properties:
        status:
          type: string
          description: Overall status of the operation.
          example: completed
        summary:
          type: object
          properties:
            total_participants:
              type: integer
              description: Total number of participants in the request.
            successful:
              type: integer
              description: Number of participants successfully enrolled.
            failed:
              type: integer
              description: Number of participants that failed validation.
        errors:
          type: array
          description: Details about failed enrollments. Empty when all succeed.
          items:
            type: object
            properties:
              participant_id:
                type: string
              error_type:
                type: string
                description: Category of the error.
                enum:
                  - validation_error
                  - email_processing_error
              error_message:
                type: string
