          in: path
          required: true
          description: Unique ID of participant that owns the adjustment.
          schema:
            type: string
        - name: adjustmentId
          in: path
          required: true
          description: ID of adjustment.
          schema:
            type: integer
      requestBody:
        content:
          application/json:
