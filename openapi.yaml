        share_daily_max:
          type: number
          nullable: true
          description: >-
            Maximum amount a participant may share per day. Null means no
            limit.
        share_weekly_max:
          type: number
          nullable: true
          description: >-
            Maximum amount a participant may share per week. Null means no
            limit.
        share_monthly_max:
          type: number
          nullable: true
          description: >-
