          enum: [0, 1]
        id:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
        active:
          type: integer
          description: 1 for true, 0 for false.
          enum: [0, 1]
        program_id:
          type: integer
    OneTimeAutoRedemption:
      type: object
      properties:
        product_sku:
          type: string
        interval:
          type: integer
        all_participant:
          type: integer
          description: 1 for true, 0 for false.
          enum: [0, 1]
        id:
          type: integer
        redemption_date:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        active:
          type: integer
          description: 1 for true, 0 for false.
          enum: [0, 1]
        program_id:
          type: string
    ProgramType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        is_active:
          type: boolean
    Actions:
      type: object
      properties:
        autoRedemption:
          type: boolean
        product:
          type: boolean
        vendor:
          type: boolean
        layout:
          type: boolean
        sweepstake:
          type: boolean
        content:
          type: boolean
        offlineRedemption:
          type: boolean
        fileUpload:
          type: boolean
        redemptionCampaigns:
          type: boolean
        programParticipantConfig:
          type: boolean
    Price:
      type: object
      properties:
        min:
          type: integer
        max:
