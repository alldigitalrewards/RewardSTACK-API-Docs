  /api/program/{programId}/catalog:
    get:
      tags:
        - Program > Catalog
      summary: Catalog Search
      operationId: CatalogSearch
      description: Returns a paginated collection of products for the specified program.
      parameters:
        - name: programId
          in: path
          required: true
          description: The unique identifier of the program.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: The page number for pagination.
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          description: The number of products to return per page. Allowed values are 10, 30, 50, 100.
          schema:
            type: integer
            enum: [ 10, 30, 50, 100 ]
            default: 30
        - name: filter[sku]
          in: query
          required: false
          description: Filter by product SKU(s). Can be a single SKU or an array of SKUs.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: filter[name]
          in: query
          required: false
          description: Filter by product name.
          schema:
            type: string
        - name: filter[category]
          in: query
          required: false
          description: Filter by product category ID(s). Can be a single category or an array of categories.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: filter[brand]
          in: query
          required: false
          description: Filter by product brand ID(s). Can be a single brand or an array of brands.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: filter[group]
          in: query
          required: false
          description: Filter by product group ID(s). Can be a single group or an array of groups.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: filter[excluded_category]
          in: query
          required: false
          description: Exclude products by category ID(s). Can be a single category or an array of categories.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: filter[excluded_brand]
          in: query
          required: false
          description: Exclude products by brand ID(s). Can be a single brand or an array of brands.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: filter[excluded_group]
          in: query
          required: false
          description: Exclude products by group ID(s). Can be a single group or an array of groups.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: filter[price][min]
          in: query
          required: false
          description: Filter products by minimum price.
          schema:
            type: number
            format: float
        - name: filter[price][max]
          in: query
          required: false
          description: Filter products by maximum price.
          schema:
            type: number
            format: float
        - name: filter[ranged]
          in: query
          required: false
          description: Filter products by whether the price is ranged (true) or a fixed value (false).
          schema:
            type: boolean
        - name: filter[currency_code]
          in: query
          required: false
          description: Filter by the product's ISO 4217 currency code, for example USD or AED, compared case-insensitively. One code as `filter[currency_code]=AED`, or several with bracket syntax, `filter[currency_code][]=AED&filter[currency_code][]=USD`; repeating the key without `[]` keeps only the last value. Empty entries are ignored.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                    description: Current page number.
                  page_size:
                    type: integer
                    description: The number of products per page.
                  total_count:
                    type: integer
                    description: The total number of products matching the query.
                  total_page_count:
                    type: integer
                    description: The total number of pages based on the total count and page size.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogProduct'
        default:
          description: Unknown exception
  

  /api/program/{programId}/service-award:
    get:
      tags:
        - Service Award
      summary: List service awards for a program
      operationId: getServiceAwardList
      security:
        - Bearer: [ ]
      description: Returns a paginated collection of service awards configured for the specified program.
      parameters:
        - name: programId
          in: path
          required: true
          description: The unique identifier of the program.
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: Request a specific page number starting with page 1.
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          description: Set the number of desired results per page.
          schema:
            type: integer
            default: 25
        - name: filters[active]
          in: query
          required: false
          description: >-
            Filter by active status. Only the exact string "true" matches
            active awards. Any other value, including the number 1, matches
            inactive awards. Send true or false.
          schema:
            type: string
          example: "true"
        - name: filters[reward_type]
          in: query
          required: false
          description: Filter by reward type. 1 = points, 2 = product SKU.
          schema:
            type: integer
            enum: [1, 2]
        - name: filters[name]
          in: query
          required: false
          description: Filter by award name, partial match.
          schema:
            type: string
        - name: filters[awardId]
          in: query
          required: false
          description: Filter by the award's unique identifier, exact match.
          schema:
            type: string
            format: uuid
        - name: filters[is_trigger_yearly]
          in: query
          required: false
          description: Filter by whether the award triggers yearly.
          schema:
            type: boolean
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceAward'
                  current_page:
                    type: integer
                    description: The current page number.
                  page_size:
                    type: integer
                    description: Number of results per page.
                  total_count:
                    type: integer
                    description: Total number of awards counted for the list.
                  total_page_count:
                    type: integer
                    description: Total number of pages available.
        '400':
          description: Missing or invalid program identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/ServiceAwardUnauthorized'
        '500':
          description: An error occurred while fetching the awards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardError'
        default:
          description: Unknown exception
    post:
      tags:
        - Service Award
      summary: Create a new service award
      operationId: createServiceAward
      security:
        - Bearer: [ ]
      description: >-
        Create a new service award for the specified program. The award defines
        the reward type, value, trigger schedule, and optional email notifications.
      parameters:
        - name: programId
          in: path
          required: true
          description: The unique identifier of the program.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAwardCreate'
      responses:
        '201':
          description: Service award created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAward'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardError'
        '401':
          $ref: '#/components/responses/ServiceAwardUnauthorized'
        '500':
          description: An error occurred while creating the service award.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardError'
        default:
          description: Unknown exception
  /api/program/{programId}/service-award/{serviceAwardId}:
    get:
      tags:
        - Service Award
      summary: Retrieve a single service award
      operationId: getServiceAward
      security:
        - Bearer: [ ]
      description: Returns a single service award by its unique identifier.
      parameters:
        - name: programId
          in: path
          required: true
          description: The unique identifier of the program.
          schema:
            type: string
            format: uuid
        - name: serviceAwardId
          in: path
          required: true
          description: The unique identifier of the service award.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardDetail'
        '404':
          description: Service award not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardError'
        '401':
          $ref: '#/components/responses/ServiceAwardUnauthorized'
        '500':
          description: An error occurred while fetching the award.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardError'
        default:
          description: Unknown exception
    put:
      tags:
        - Service Award
      summary: Update a service award
      operationId: updateServiceAward
      security:
        - Bearer: [ ]
      description: >-
        Update an existing service award. Only include the fields you wish
        to change. reward_type and reward_value must be sent together. Once
        the award has a completed fulfillment, reward_type, reward_value,
        is_trigger_yearly, interval, issuance_time, and timezone can no
        longer be changed; name, active, and the email fields can still be
        changed at any time.
      parameters:
        - name: programId
          in: path
          required: true
          description: The unique identifier of the program.
          schema:
            type: string
            format: uuid
        - name: serviceAwardId
          in: path
          required: true
          description: The unique identifier of the service award.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAwardUpdate'
      responses:
        '200':
          description: Service award updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAward'
        '400':
          description: >-
            Validation error, including sending only one of reward_type and
            reward_value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardError'
        '404':
          description: Service award not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardError'
        '422':
          description: >-
            The award has a completed fulfillment and the request would
            change reward_type, reward_value, is_trigger_yearly, interval,
            issuance_time, or timezone. Other fields can still be changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardError'
              example:
                error: >-
                  This award has completed fulfillments; its reward and
                  schedule cannot be modified.
        '401':
          $ref: '#/components/responses/ServiceAwardUnauthorized'
        '500':
          description: An error occurred while updating the service award.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardError'
        default:
          description: Unknown exception
    delete:
      tags:
        - Service Award
      summary: Delete a service award
      operationId: deleteServiceAward
      security:
        - Bearer: [ ]
      description: >-
        Delete a service award. The award is removed. Any of its
        fulfillments that have not yet been processed are marked failed.
        Participant enrollment records for the award are not removed.
      parameters:
        - name: programId
          in: path
          required: true
          description: The unique identifier of the program.
          schema:
            type: string
            format: uuid
        - name: serviceAwardId
          in: path
          required: true
          description: The unique identifier of the service award.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Service award deleted
        '404':
          description: Service award not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardError'
        '401':
          $ref: '#/components/responses/ServiceAwardUnauthorized'
        '500':
          description: Deletion failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAwardError'
        default:
          description: Unknown exception
  /api/program/{programId}/service-award/{serviceAwardId}/participant:
